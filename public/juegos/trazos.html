<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trazá letras y números</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/prepa.css">
<style>
  :root { --materia: #E8574A; }
  .pizarra {
    margin-top: 12px; background: var(--face); border: 4px solid var(--rim); border-radius: 22px;
    position: relative; aspect-ratio: 1; width: min(96vw, 460px); overflow: hidden;
  }
  .pizarra canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .ayuda { position: absolute; top: 8px; left: 10px; font-size: 2.6rem; line-height: 1; pointer-events: none; }
  .ayuda small { display: block; font-size: 1rem; font-weight: 800; color: var(--materia); text-align: center; }
  .herr { display: flex; justify-content: center; gap: 14px; margin-top: 12px; }
  .herr button { font-size: 2rem; padding: 2px 22px; }
  .herr #listoBtn { background: #C9F2D6; }
  /* En el celular, la fila se corre a la derecha para que el 🏠 (fijo abajo a la izquierda) no tape la 🧽 */
  @media (max-width: 480px) { .herr { gap: 10px; padding-left: 58px; } }
  .pizarra.gano { animation: pulse .6s ease-in-out 2; }
  /* 👆 El dedito que muestra el camino de la letra */
  .dedo { position: absolute; left: 0; top: 0; font-size: 2.6rem; line-height: 1; pointer-events: none; transform: translate(-30%, -10%); z-index: 2; }
  .dedo.arriba { opacity: .55; transform: translate(-30%, -45%) scale(1.1); } /* levantó el dedo entre un trazo y otro */
  .dedo[hidden] { display: none; }
  /* La palabra que se va armando: las letras ya trazadas quedan chiquitas, con la tinta del niño */
  .palabra {
    margin-top: 10px; width: min(96vw, 460px); min-height: 64px; padding: 4px 10px;
    background: var(--face); border: 4px solid var(--rim); border-radius: 18px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; row-gap: 2px;
  }
  .palabra[hidden] { display: none; }
  .palabra { column-gap: 18px; }
  .palabra .grupo { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; max-width: 100%; } /* cada palabra junta */
  .palabra canvas { display: block; border-radius: 10px; }
  .palabra canvas.actual { background: #FFF3C4; }
  /* Mi nombre: el papá lo escribe una vez y queda guardado en este dispositivo */
  .nombre { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(96vw, 460px); }
  .nombre[hidden], .nombre [hidden] { display: none; }
  .nombre form { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; background: var(--face); border: 4px solid var(--rim); border-radius: 18px; padding: 10px; }
  .nombre label { font-weight: 800; width: 100%; text-align: center; }
  .nombre input {
    font: inherit; font-size: 1.4rem; font-weight: 700; color: var(--ink); width: 12em; max-width: 100%;
    border: 3px solid var(--soft); border-radius: 12px; padding: 4px 10px; user-select: text; -webkit-user-select: text;
  }
  .nombre input:focus-visible { outline: 3px dashed var(--materia); outline-offset: 2px; }
  .nombre button { font-size: 1.1rem; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="start" id="start">
  <div class="big" aria-hidden="true">✍️</div>
  <h1>Trazá letras y números</h1>
  <button id="startBtn" aria-label="Empezar">▶️</button>
  <p>Subile el volumen 🔊. Pasá el dedo por encima de la letra punteada, sin salirte. Al final vienen palabras, y con «Mi nombre» se escribe el nombre.</p>
</div>

<div class="wrap top">
  <div class="levels" role="group" aria-label="Nivel">
    <button class="auto" data-nivel="auto" aria-pressed="true" aria-label="De a poquito: sube solo">🪜</button>
    <button data-nivel="vocales">A e i</button>
    <button data-nivel="numeros">1 2 3</button>
    <button data-nivel="minus" aria-label="Letras minúsculas">b c d</button>
    <button data-nivel="mayus" aria-label="Letras mayúsculas">B C D</button>
    <button data-nivel="palabras" aria-label="Palabras">sol</button>
    <button data-nivel="nombre">Mi nombre</button>
  </div>
  <div class="escalera" id="escalera"></div>
  <div class="stars" id="stars">⭐ 0</div>
</div>

<div class="wrap instr"><button class="oir" id="oir" aria-label="Escuchar otra vez">🔊</button><button class="lento" id="lento" aria-label="Escuchar despacio">🐢</button><div class="txt" id="instr"></div></div>
<div class="palabra" id="palabra" aria-hidden="true" hidden></div>
<div class="pizarra" id="pizarra">
  <canvas id="guia" aria-hidden="true"></canvas>
  <canvas id="tinta" aria-label="Pizarra para trazar con el dedo"></canvas>
  <div class="ayuda" id="ayuda" aria-hidden="true"></div>
  <div class="dedo" id="dedo" aria-hidden="true" hidden>👆</div>
</div>
<div class="herr">
  <button id="borrarBtn" aria-label="Borrar">🧽</button>
  <button id="listoBtn" aria-label="¡Ya terminé!">✅</button>
  <button id="nextBtn" aria-label="Otra">➡️</button>
</div>
<div class="nombre" id="nombreZona" hidden>
  <form id="nombreForm" hidden>
    <label for="nombreIn">✍️ Nombre para trazar (lo escribe un adulto)</label>
    <input id="nombreIn" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
    <button type="submit">✅ Listo</button>
  </form>
  <button id="cambiarNombre" type="button">✏️ Cambiar el nombre</button>
</div>
<div class="wrap feedback" id="feedback" aria-live="polite"></div>

<script type="module">
import { elogio } from "../js/voz.js";
import { decir, instruccion, feedback, estrellas, niveles, alEmpezar, ayudaSiSeQueda } from "../js/prepa.js";
import { escalera } from "../js/escalera.js";
import { perfilActivo } from "../js/perfil.js";
import { trazosDe, caja, RENGLON, tieneTrazos } from "../js/trazos.js";

const $ = id => document.getElementById(id);
const ESCAPE = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const escapar = t => String(t).replace(/[&<>"']/g, c => ESCAPE[c]);

// 🗣️ Cómo se dice cada letra
const NOMBRE = { a: "a", b: "be", c: "ce", d: "de", e: "e", f: "efe", g: "ge", h: "hache", i: "i", j: "jota", k: "ka", l: "ele", m: "eme", n: "ene", ñ: "eñe",
  o: "o", p: "pe", q: "cu", r: "erre", s: "ese", t: "te", u: "u", v: "ve", w: "doble ve", x: "equis", y: "ye", z: "zeta" };
const NUMEROS = ["cero", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
const MARCA = { á: ["a", "con tilde"], é: ["e", "con tilde"], í: ["i", "con tilde"], ó: ["o", "con tilde"], ú: ["u", "con tilde"], ü: ["u", "con diéresis"] };
function decirLetra(ch) {
  if (ch >= "0" && ch <= "9") return `el ${NUMEROS[ch]}`;
  const min = ch.toLowerCase(), [base, marca] = MARCA[min] || [min, ""];
  return ["la", NOMBRE[base] || ch, ch !== min ? "mayúscula" : "", marca].filter(Boolean).join(" ");
}

// 🖼️ Un dibujo y una palabra de ejemplo para cada letra
const EJEMPLO = {
  m: ["✋", "mano"], p: ["🦆", "pato"], s: ["☀️", "sol"], l: ["🌙", "luna"], t: ["🍅", "tomate"], n: ["☁️", "nube"], d: ["🎲", "dado"],
  b: ["🐋", "ballena"], c: ["🏠", "casa"], f: ["🍓", "fresa"], g: ["🐱", "gato"], h: ["🍦", "helado"], j: ["🦒", "jirafa"], k: ["🐨", "koala"],
  ñ: ["🍍", "piña"], q: ["🧀", "queso"], r: ["🐭", "ratón"], v: ["🐮", "vaca"], w: ["🥝", "kiwi"], x: ["🚕", "taxi"], y: ["🪀", "yoyo"], z: ["👟", "zapato"],
  á: ["🌳", "árbol"], é: ["☕", "café"], í: ["🥜", "maní"], ó: ["🚚", "camión"], ú: ["🦉", "búho"],
};
const letra = ch => { const [e, pal] = EJEMPLO[ch.toLowerCase()]; return { ch, d: decirLetra(ch), e, pal }; };
// Palabras: [palabra, dibujo, palabra de ejemplo (en las sílabas)]
const palabra = ([p, e, pal]) => ({ palabra: p, letras: Array.from(p), d: p, e, pal: pal || p });

// ✏️ Qué se traza. d = cómo se dice, e/pal = dibujo y palabra de ejemplo
const SETS = {
  vocales: [
    { ch: "A", d: "la a", e: "✈️", pal: "avión" }, { ch: "a", d: "la a", e: "✈️", pal: "avión" },
    { ch: "E", d: "la e", e: "🐘", pal: "elefante" }, { ch: "e", d: "la e", e: "🐘", pal: "elefante" },
    { ch: "I", d: "la i", e: "🦎", pal: "iguana" }, { ch: "i", d: "la i", e: "🦎", pal: "iguana" },
    { ch: "O", d: "la o", e: "🐻", pal: "oso" }, { ch: "o", d: "la o", e: "🐻", pal: "oso" },
    { ch: "U", d: "la u", e: "🍇", pal: "uvas" }, { ch: "u", d: "la u", e: "🍇", pal: "uvas" },
  ],
  numeros: NUMEROS
    .map((d, i) => ({ ch: String(i), d: `el ${d}`, n: i }))
    .slice(1).concat([{ ch: "0", d: "el cero", n: 0 }]),
  letras: Array.from("mpsltnd").map(letra),
  minus: Array.from("bcdfghjklmnñpqrstvwxyz").map(letra),
  mayus: Array.from("BCDFGHJKLMNÑPQRSTVWXYZ").map(letra),
  tildes: Array.from("áéíóú").map(letra),
  silabas: [["ma", "👩", "mamá"], ["pa", "👨", "papá"], ["mi", "🍯", "miel"], ["mo", "🐒", "mono"], ["pe", "🐶", "perro"], ["pi", "🍍", "piña"],
    ["po", "🐥", "pollito"], ["sa", "🐸", "sapo"], ["so", "☀️", "sol"], ["si", "🪑", "silla"], ["lo", "🦜", "loro"], ["lu", "🌙", "luna"], ["li", "🍋", "limón"],
    ["le", "🦁", "león"], ["ta", "☕", "taza"], ["ti", "🐯", "tigre"], ["to", "🍅", "tomate"], ["nu", "☁️", "nube"], ["da", "🎲", "dado"], ["de", "☝️", "dedo"],
    ["do", "🍩", "dona"], ["di", "🦕", "dinosaurio"]].map(palabra),
  p3: [["sol", "☀️"], ["oso", "🐻"], ["ola", "🌊"], ["pan", "🍞"], ["uva", "🍇"], ["sal", "🧂"], ["ojo", "👁️"], ["pez", "🐟"], ["pie", "🦶"], ["luz", "💡"], ["rey", "👑"]].map(palabra),
  p4: [["mamá", "👩"], ["papá", "👨"], ["casa", "🏠"], ["luna", "🌙"], ["pato", "🦆"], ["sapo", "🐸"], ["dedo", "☝️"], ["nube", "☁️"], ["gato", "🐱"],
    ["vaca", "🐮"], ["mano", "✋"], ["sopa", "🍲"], ["piña", "🍍"], ["taza", "☕"], ["lupa", "🔍"], ["bebé", "👶"]].map(palabra),
  p5: [["perro", "🐶"], ["queso", "🧀"], ["ratón", "🐭"], ["fresa", "🍓"], ["mango", "🥭"], ["árbol", "🌳"], ["lápiz", "✏️"], ["tigre", "🐯"], ["limón", "🍋"],
    ["conejo", "🐰"], ["zapato", "👟"], ["helado", "🍦"], ["volcán", "🌋"], ["jirafa", "🦒"], ["banano", "🍌"], ["ballena", "🐋"], ["tortuga", "🐢"], ["gallina", "🐔"]].map(palabra),
};
for (const lista of Object.values(SETS)) lista.forEach(x => { x.letras ||= [x.ch]; });
SETS.palabras = [...SETS.p3, ...SETS.p4, ...SETS.p5];
const de = (lista, chars) => Array.from(chars).map(ch => lista.find(x => x.ch === ch));
const minus = chars => de([...SETS.vocales, ...SETS.minus, ...SETS.tildes], chars);
const mayus = chars => de([...SETS.vocales, ...SETS.mayus], chars);

// 🪜 De a poquito: primero las vocales grandes con el puntito de inicio y mucha tolerancia;
// después números y consonantes, el resto del abecedario, mayúsculas, sílabas y palabras.
// Los escalones nuevos van siempre al final: el progreso guardado es el número del escalón.
// tol = [cuánto de la letra hay que cubrir, cuánto del trazo tiene que quedar dentro de la letra]
// punto = se ven los puntitos de inicio · orden = se pide empezar en el puntito 1 (se avisa con un «¡Casi!»)
const VOC_MAY = SETS.vocales.filter(x => x.ch === x.ch.toUpperCase());
const VOC_MIN = SETS.vocales.filter(x => x.ch !== x.ch.toUpperCase());
const NUM_1_5 = SETS.numeros.filter(x => x.n >= 1 && x.n <= 5);
const NUM_6_0 = SETS.numeros.filter(x => x.n > 5 || x.n === 0);
const ESCALONES = [
  { lista: VOC_MAY, tol: [0.6, 0.75], punto: true },                               // 1. A E I O U, con puntito de inicio
  { lista: VOC_MIN, tol: [0.62, 0.78], punto: true },                              // 2. a e i o u
  { lista: NUM_1_5, tol: [0.65, 0.8], punto: true },                               // 3. 1 al 5
  { lista: NUM_6_0, tol: [0.68, 0.82], punto: true },                              // 4. 6 al 9 y el 0
  { lista: SETS.letras.slice(0, 3), tol: [0.7, 0.84], punto: true },               // 5. m p s
  { lista: SETS.letras.slice(3), tol: [0.72, 0.85], orden: true },                 // 6. l t n d
  { lista: [...SETS.vocales, ...SETS.numeros], tol: [0.74, 0.86], orden: true },  // 7. vocales y números revueltos
  { lista: [...SETS.vocales, ...SETS.numeros, ...SETS.letras], tol: [0.76, 0.88], orden: true }, // 8. todo revuelto, más exigente
  { lista: minus("bhkfldt"), tol: [0.7, 0.84], punto: true, orden: true },         // 9. con palito alto: b h k f
  { lista: minus("cgqaoe"), tol: [0.7, 0.84], punto: true, orden: true },          // 10. con curva: c g q
  { lista: minus("rñjnmhu"), tol: [0.72, 0.85], punto: true, orden: true },        // 11. con puente o colita: r ñ j
  { lista: minus("vwxyzk"), tol: [0.72, 0.85], punto: true, orden: true },         // 12. en diagonal: v w x y z
  { lista: SETS.tildes, tol: [0.72, 0.85], punto: true, orden: true },             // 13. con tilde: á é í ó ú
  { lista: [...VOC_MIN, ...SETS.minus, ...SETS.tildes], tol: [0.76, 0.88], orden: true }, // 14. todas las minúsculas revueltas
  { lista: mayus("LTHFEI"), tol: [0.72, 0.85], punto: true, orden: true },         // 15. mayúsculas rectas
  { lista: mayus("VWXYZKMNA"), tol: [0.72, 0.85], punto: true, orden: true },      // 16. mayúsculas en diagonal
  { lista: mayus("CGOQSUJDBPRÑ"), tol: [0.72, 0.85], punto: true, orden: true },   // 17. mayúsculas con curva
  { lista: SETS.silabas, tol: [0.72, 0.85], punto: true },                         // 18. sílabas: ma, pa, so…
  { lista: SETS.p3, tol: [0.72, 0.85], punto: true, orden: true },                 // 19. palabras de 3 letras
  { lista: SETS.p4, tol: [0.74, 0.86], orden: true },                              // 20. palabras de 4 letras
  { lista: SETS.p5, tol: [0.76, 0.88], orden: true },                              // 21. palabras largas
];
const TOL_MANUAL = [0.72, 0.85];
const esc = escalera("trazos", { escalones: ESCALONES.length, inicio: edad => edad === null || edad <= 5 ? 0 : edad === 6 ? 2 : 4 });

const S = 600;            // tamaño interno de la pizarra
const Q = 0.2;            // escala de las máscaras para evaluar (120×120)
const G = 56;             // grosor de la letra guía
const TINTA = 34;         // grosor del trazo del niño
const COLOR_TINTA = "#E8574A";
const VERDE = "#2FA85A";
const VEL = 380;          // qué tan rápido traza el dedito (pixeles por segundo)
const FONT = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';

let nivel = "auto", idx = 0, item = null, trazos = [], actual = null, listo = false, fallos = 0;
let tol = TOL_MANUAL, conPunto = false, mostroCamino = false, ronda = 0, pelicula = 0;
let pideOrden = false, avisoOrden = false;
let geo = null;           // la letra en la pizarra: sus trazos, el renglón y los puntitos de inicio
// Una ronda puede ser una letra o una palabra (o el nombre): se traza letra por letra
let letras = [], li = 0, hechas = [], fallosMax = 0, ayudaRonda = false, rondaLista = false, turno = 0, nombre = "";
const stars = estrellas("trazos-stars");

const guia = $("guia"), tinta = $("tinta");
[guia, tinta].forEach(c => { c.width = S; c.height = S; });
const gctx = guia.getContext("2d"), tctx = tinta.getContext("2d");

// ---------- Letra ----------
// Se dibuja a partir de sus trazos (js/trazos.js), no de una fuente: la guía, la tolerancia,
// los puntitos de inicio y el dedito salen de los mismos datos, así coinciden siempre.
function medir(ch) {
  const c = caja(ch);
  const h = c.y1 - c.y0, w = Math.max(c.x1 - c.x0, 0.3); // la i y la l son flaquitas
  const k = Math.min((S * 0.62) / h, (S * 0.72) / w);
  const ox = S / 2 - ((c.x0 + c.x1) / 2) * k, oy = S / 2 + 18 - ((c.y0 + c.y1) / 2) * k;
  const ts = trazosDe(ch).map(t => t.map(([x, y]) => [ox + x * k, oy + y * k]));
  return { trazos: ts, inicio: ts[0][0], renglon: oy + RENGLON * k, marcas: marcasDe(ts), ox, oy, k };
}

const largoDe = t => t.reduce((s, p, i) => (i ? s + Math.hypot(p[0] - t[i - 1][0], p[1] - t[i - 1][1]) : 0), 0);

// 🟢 Dónde va el puntito de cada trazo y hacia dónde apunta su flechita
function marcasDe(ts) {
  const marcas = [];
  ts.forEach(t => {
    // Si dos trazos empiezan en el mismo lugar (la punta de la A), el puntito del segundo se corre por su camino
    // hasta que no tape el puntito ni la flechita de otro
    const tapa = ([x, y]) => marcas.some(m => Math.hypot(x - m.x, y - m.y) < 46 || (m.flecha && Math.hypot(x - m.flecha.x, y - m.flecha.y) < 46));
    let i = 0;
    while (i < t.length - 1 && tapa(t[i])) i++;
    // La flechita va un poquito más adelante, en la dirección del trazo
    let j = i, largo = 0;
    while (j < t.length - 1 && largo < 52) { largo += Math.hypot(t[j + 1][0] - t[j][0], t[j + 1][1] - t[j][1]); j++; }
    const a = t[Math.max(i, j - 3)], b = t[Math.min(t.length - 1, j + 3)];
    marcas.push({ x: t[i][0], y: t[i][1], flecha: j > i ? { x: t[j][0], y: t[j][1], ang: Math.atan2(b[1] - a[1], b[0] - a[0]) } : null });
  });
  return marcas;
}

/** Pinta trazos con un grosor (un trazo de un solo punto es un puntito redondo). */
function pintarTrazos(ctx, ts, ancho, radioPunto) {
  ctx.lineWidth = ancho; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ts.forEach(t => {
    ctx.beginPath();
    if (t.length === 1) { ctx.arc(t[0][0], t[0][1], radioPunto, 0, Math.PI * 2); ctx.fill(); return; }
    t.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
  });
}
const trazarLetra = (ctx, ancho, radioPunto) => pintarTrazos(ctx, geo.trazos, ancho, radioPunto);

// Los puntitos se ven mientras el escalón los trae, después del dedito y después de avisarle por dónde se empieza
const conMarcas = () => conPunto || mostroCamino || avisoOrden;

function pintarGuia(faltantes, marcas = conMarcas()) {
  gctx.clearRect(0, 0, S, S);
  gctx.setLineDash([]);
  // renglón
  gctx.strokeStyle = "#DCE6EF"; gctx.lineWidth = 3;
  gctx.beginPath(); gctx.moveTo(30, geo.renglon); gctx.lineTo(S - 30, geo.renglon); gctx.stroke();
  // la letra, suavecita
  gctx.fillStyle = gctx.strokeStyle = "#EAF1F8"; trazarLetra(gctx, G, G * 0.5);
  if (faltantes) {
    gctx.fillStyle = "rgba(255, 200, 61, .85)";
    faltantes.forEach(([x, y]) => gctx.fillRect(x / Q - 2.5, y / Q - 2.5, 1 / Q + 5, 1 / Q + 5));
  }
  // y punteada por el medio, por donde va el dedo
  gctx.fillStyle = gctx.strokeStyle = "#8FA7BF"; gctx.setLineDash([0.1, 17]);
  trazarLetra(gctx, 9, 9);
  gctx.setLineDash([]);
  if (marcas) pintarMarcas();
}

/** 🟢 El puntito de inicio de cada trazo (con su número si hay varios) y una flechita que dice para dónde ir. */
function pintarMarcas() {
  const varios = geo.marcas.length > 1;
  gctx.lineJoin = "round";
  geo.marcas.forEach(({ flecha: f }) => {
    if (!f) return;
    gctx.save(); gctx.translate(f.x, f.y); gctx.rotate(f.ang);
    gctx.beginPath(); gctx.moveTo(15, 0); gctx.lineTo(-10, -14); gctx.lineTo(-4, 0); gctx.lineTo(-10, 14); gctx.closePath();
    gctx.fillStyle = VERDE; gctx.strokeStyle = "#FFFFFF"; gctx.lineWidth = 4;
    gctx.stroke(); gctx.fill();
    gctx.restore();
  });
  geo.marcas.forEach(({ x, y }, k) => {
    gctx.fillStyle = VERDE; gctx.strokeStyle = "#FFFFFF"; gctx.lineWidth = 5;
    gctx.beginPath(); gctx.arc(x, y, 21, 0, Math.PI * 2); gctx.fill(); gctx.stroke();
    if (varios) {
      gctx.fillStyle = "#FFFFFF"; gctx.font = `800 28px ${FONT}`; gctx.textAlign = "center"; gctx.textBaseline = "middle";
      gctx.fillText(String(k + 1), x, y + 2);
    }
  });
}

function pintarTinta() {
  tctx.clearRect(0, 0, S, S);
  tctx.strokeStyle = COLOR_TINTA; tctx.lineWidth = TINTA; tctx.lineCap = "round"; tctx.lineJoin = "round";
  trazos.forEach(t => {
    tctx.beginPath();
    t.forEach(([x, y], i) => i ? tctx.lineTo(x, y) : tctx.moveTo(x, y));
    if (t.length === 1) tctx.lineTo(t[0][0] + .1, t[0][1]);
    tctx.stroke();
  });
}

/**
 * 🔤 La palabra (o el nombre) que se va armando, arriba de la pizarra: las letras ya trazadas
 * quedan chiquitas con la tinta del niño, la que toca se marca en amarillo y las que faltan, en gris.
 */
function pintarPalabra() {
  const zona = $("palabra");
  zona.hidden = letras.length < 2;
  if (zona.hidden) return;
  const ALTO = 56, K = ALTO / 1.04, dpr = window.devicePixelRatio || 1;
  const grupos = [];
  letras.forEach((ch, n) => {
    if (ch === " " || !grupos.length) { const g = document.createElement("span"); g.className = "grupo"; grupos.push(g); }
    if (ch !== " ") grupos[grupos.length - 1].append(letraChiquita(ch, n));
  });
  zona.replaceChildren(...grupos);
  function letraChiquita(ch, n) {
    const b = caja(ch), ancho = Math.max(0.22, b.x1 - b.x0) + 0.14;
    const c = document.createElement("canvas");
    c.width = Math.round(ancho * K * dpr); c.height = Math.round(ALTO * dpr);
    c.style.width = `${ancho * K}px`; c.style.height = `${ALTO}px`;
    if (n === li && !rondaLista) c.className = "actual";
    const x = c.getContext("2d");
    x.scale(K * dpr, K * dpr);
    x.translate(ancho / 2 - (b.x0 + b.x1) / 2, 0.02);
    if (hechas[n]) { x.strokeStyle = x.fillStyle = COLOR_TINTA; pintarTrazos(x, hechas[n], 0.075, 0.04); }
    else { x.strokeStyle = x.fillStyle = n === li ? "#8FA7BF" : "#C9D6E3"; pintarTrazos(x, trazosDe(ch), 0.06, 0.035); }
    return c;
  }
}

// ---------- Evaluación ----------
function mascara(dibujar) {
  const n = Math.round(S * Q);
  const c = document.createElement("canvas"); c.width = n; c.height = n;
  const x = c.getContext("2d"); x.scale(Q, Q); x.fillStyle = x.strokeStyle = "#000";
  dibujar(x);
  const d = x.getImageData(0, 0, n, n).data;
  const m = new Uint8Array(n * n);
  for (let i = 0; i < n * n; i++) m[i] = d[i * 4 + 3] > 100 ? 1 : 0;
  return { m, n };
}

// Cada trazo tiene que quedar cubierto al menos en esta parte (si no, la «a» valía sin el palito y la «t» sin la cruz).
// Se mira la parte de cada trazo que la tinta de los otros no alcanza a tapar: el palito de la «a» pega con la bolita,
// así que lo que cuenta son sus puntas.
const POR_TRAZO = 0.5;
function propiosDe(ts) {
  return ts.map((t, k) => {
    const propio = mascara(x => pintarTrazos(x, [t], G * 0.5, G * 0.3)).m;
    if (ts.length < 2) return propio;
    const otros = mascara(x => pintarTrazos(x, ts.filter((_, j) => j !== k), G * 1.8, G * 0.9)).m;
    const solo = propio.map((v, i) => (v && !otros[i] ? 1 : 0));
    return solo.reduce((a, b) => a + b, 0) >= 4 ? solo : propio;
  });
}

function evaluar(ts = trazos) {
  // centro: el medio de cada trazo, lo que hay que cubrir · margen: hasta dónde se vale salirse
  geo.centro ||= mascara(x => trazarLetra(x, G * 0.5, G * 0.3));
  geo.margen ||= mascara(x => trazarLetra(x, G * 2.4, G * 1.2));
  geo.porTrazo ||= propiosDe(geo.trazos);
  const tintaM = mascara(x => {
    x.lineWidth = G * 1.3; x.lineCap = "round"; x.lineJoin = "round";
    ts.forEach(t => { x.beginPath(); t.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); if (t.length === 1) x.lineTo(t[0][0] + .1, t[0][1]); x.stroke(); });
  });
  const { n } = tintaM;
  let total = 0, cubiertos = 0; const faltantes = [];
  for (let i = 0; i < n * n; i++) if (geo.centro.m[i]) {
    total++;
    if (tintaM.m[i]) cubiertos++; else faltantes.push([i % n, Math.floor(i / n)]);
  }
  let puntos = 0, dentro = 0;
  ts.forEach(t => t.forEach(([a, b]) => {
    puntos++;
    const i = Math.min(n - 1, Math.max(0, Math.floor(b * Q))) * n + Math.min(n - 1, Math.max(0, Math.floor(a * Q)));
    if (geo.margen.m[i]) dentro++;
  }));
  // el trazo menos cubierto
  const minTrazo = Math.min(...geo.porTrazo.map(m => {
    let t = 0, c = 0;
    for (let i = 0; i < n * n; i++) if (m[i]) { t++; if (tintaM.m[i]) c++; }
    return t ? c / t : 1;
  }));
  return { cobertura: total ? cubiertos / total : 0, precision: puntos ? dentro / puntos : 0, minTrazo, faltantes };
}

// ---------- 👆 El camino de la letra ----------
/** Todos los puntos de la letra en el orden en que se trazan. */
const caminoDeLetra = () => (geo ? geo.trazos.flat() : []);

// En una letra sola se dice como en el escalón («la a», «el uno»); en una palabra, el nombre de la letra
const dLetra = () => (letras.length > 1 || item?.esNombre ? decirLetra(letras[li]) : item.d);

// «en el 2», «en el 2 y en el 3», «en el 2, en el 3 y en el 4»
function losDemas(n) {
  const l = Array.from({ length: n - 1 }, (_, i) => `en el ${i + 2}`);
  return l.length > 1 ? `${l.slice(0, -1).join(", ")} y ${l[l.length - 1]}` : l[0];
}

/**
 * El dedito hace la letra trazo por trazo, en orden, dejando un rastro amarillo, y entre un trazo
 * y otro levanta el dedo (cuenta como ayuda para la escalera).
 */
function mostrarCamino() {
  if (listo || !geo) return;
  mostroCamino = true;
  const esta = ronda, mia = ++pelicula, dedo = $("dedo"), ts = geo.trazos;
  pintarGuia(null, true);
  feedback("", "👆", "Mirá el dedito");
  decir(ts.length > 1
    ? `Mirá el dedito: empezá en el puntito 1. Después levantá el dedo y seguí ${losDemas(ts.length)}.`
    : `Mirá el dedito: empezá en el puntito verde y seguí ${dLetra()}.`);
  const partes = [];
  ts.forEach((t, k) => {
    if (k) partes.push({ salto: [ts[k - 1][ts[k - 1].length - 1], t[0]], dura: 550 }); // el dedo va por el aire
    partes.push({ t, hecho: 0, dura: t.length === 1 ? 350 : Math.max(450, (largoDe(t) / VEL) * 1000) });
  });
  const total = partes.reduce((s, p) => s + p.dura, 0);
  const mover = ([x, y]) => { dedo.style.left = `${(x / S) * 100}%`; dedo.style.top = `${(y / S) * 100}%`; };
  let pinto = false;
  const rastro = (p, hasta) => {
    gctx.fillStyle = "rgba(255, 200, 61, .9)";
    for (; p.hecho <= hasta; p.hecho++, pinto = true) {
      const [x, y] = p.t[p.hecho];
      gctx.beginPath(); gctx.arc(x, y, p.t.length === 1 ? 27 : 9, 0, Math.PI * 2); gctx.fill();
    }
  };
  dedo.classList.remove("arriba"); mover(ts[0][0]); dedo.hidden = false;
  let t0 = null;
  const paso = ahora => {
    if (esta !== ronda || mia !== pelicula || listo) { if (mia === pelicula) dedo.hidden = true; return; } // cambió la ronda: el dedito se va
    t0 ??= ahora;
    const pasado = Math.max(0, ahora - t0);
    let r = pasado;
    for (const p of partes) {
      const f = Math.min(1, r / p.dura);
      if (p.salto) {
        const [[x0, y0], [x1, y1]] = p.salto;
        dedo.classList.add("arriba"); mover([x0 + (x1 - x0) * f, y0 + (y1 - y0) * f]);
      } else {
        const hasta = Math.round(f * (p.t.length - 1));
        rastro(p, hasta);
        dedo.classList.remove("arriba"); mover(p.t[hasta]);
      }
      if (f < 1) break;
      r -= p.dura;
    }
    if (pinto) { pintarMarcas(); pinto = false; } // los puntitos quedan encima del rastro
    if (pasado < total) requestAnimationFrame(paso);
    else setTimeout(() => { if (esta === ronda && mia === pelicula) dedo.hidden = true; }, 600);
  };
  requestAnimationFrame(paso);
}
// Si se queda sin trazar: primero se repite la instrucción y después el dedito muestra el camino
const ayuda = ayudaSiSeQueda({ senalar: mostrarCamino });

// ---------- Dedo ----------
function punto(e) {
  const r = tinta.getBoundingClientRect();
  return [(e.clientX - r.left) * S / r.width, (e.clientY - r.top) * S / r.height];
}
tinta.addEventListener("pointerdown", e => {
  if (listo) return;
  tinta.setPointerCapture(e.pointerId);
  actual = [punto(e)]; trazos.push(actual);
  pintarTinta();
});
tinta.addEventListener("pointermove", e => {
  if (!actual) return;
  const p = punto(e), u = actual[actual.length - 1];
  if (Math.hypot(p[0] - u[0], p[1] - u[1]) < 4) return;
  actual.push(p); pintarTinta();
});
const soltar = () => {
  if (!actual) return;
  actual = null;
  // Si ya quedó bien, se celebra solo (sin tener que tocar ✅)
  siQuedoBien(evaluar());
};
tinta.addEventListener("pointerup", soltar);
tinta.addEventListener("pointercancel", soltar);

/** Si el dibujo ya quedó bien, celebra. Devuelve false si todavía no. */
function siQuedoBien(r) {
  if (r.cobertura < tol[0] || r.precision < tol[1] || r.minTrazo < POR_TRAZO) return false;
  if (empezoEnOtroLado()) avisarOrden(); else ganarLetra();
  return true;
}

// En los escalones altos se pide empezar en el puntito 1. Se avisa una sola vez por letra
// y la vez siguiente vale como sea: es para ir haciendo el hábito, no para trabarlo.
function empezoEnOtroLado() {
  if (!pideOrden || avisoOrden || !trazos.length) return false;
  const [x, y] = trazos[0][0], [a, b] = geo.inicio;
  return Math.hypot(x - a, y - b) > 75;
}

function avisarOrden() {
  avisoOrden = true; fallos++;
  pintarGuia(null, true);
  feedback("almost", "🤏", "¡Casi!");
  decir(`¡Casi! Te quedó bonita, pero ${dLetra()} se empieza en el puntito verde. Hacela otra vez desde ahí.`);
  // Se borra lo que hizo para que la vuelva a hacer (si no empezó ya otra)
  const esta = ronda, cuantos = trazos.length;
  setTimeout(() => { if (esta === ronda && !listo && !actual && trazos.length === cuantos) { trazos = []; pintarTinta(); } }, 1800);
}

/** Terminó una letra: si es una palabra, se guarda chiquita y sigue la otra; si no, ganó la ronda. */
function ganarLetra() {
  listo = true;
  ayuda.parar();
  $("dedo").hidden = true;
  pintarGuia(null, false);
  fallosMax = Math.max(fallosMax, fallos);
  ayudaRonda ||= ayuda.usada || mostroCamino;
  // La tinta se guarda en las coordenadas de la letra (0 a 1), para dibujarla chiquita en la palabra
  hechas[li] = trazos.map(t => t.map(([x, y]) => [(x - geo.ox) / geo.k, (y - geo.oy) / geo.k]));
  let sig = li + 1;
  while (letras[sig] === " ") sig++;
  if (sig >= letras.length) { ganarRonda(); return; }
  pintarPalabra();
  feedback("ok", "👍", "¡Bien!");
  const t = turno;
  setTimeout(() => { if (t === turno) { li = sig; empezarLetra(); } }, 900);
}

function ganarRonda() {
  rondaLista = true;
  pintarPalabra();
  $("pizarra").classList.remove("gano"); void $("pizarra").offsetWidth; $("pizarra").classList.add("gano");
  const frase = item.esNombre ? `¡Escribiste tu nombre: ${nombre}!` : letras.length > 1 ? `¡Escribiste ${item.palabra}!` : `¡Trazaste ${item.d}!`;
  if (fallosMax === 0 && !ayudaRonda) { const bien = elogio(); stars.sumar(); feedback("ok", "🎉", bien); decir(`${bien} ${frase}`); }
  else { feedback("almost", "🤏", "¡Ahora sí!"); decir(`¡Ahora sí! ${frase}`); }
  esc.resultado({ fallos: fallosMax, ayuda: ayudaRonda });
  $("nextBtn").classList.add("pulse");
}

$("listoBtn").addEventListener("click", () => {
  if (listo) return;
  if (!trazos.length) { decir(`Pasá el dedo por encima de ${dLetra()}.`); return; }
  const r = evaluar();
  if (siQuedoBien(r)) return;
  fallos++;
  if (r.precision < tol[1] - 0.15) {
    feedback("bad", "🙈", "Te saliste");
    decir("Uy, te saliste mucho de la letra. Borrá y probá otra vez, despacito.");
  } else if (r.cobertura >= tol[0] - 0.27) {
    pintarGuia(r.faltantes);
    feedback("almost", "🤏", "¡Casi!");
    decir("¡Casi! Te faltó el pedacito amarillo.");
  } else {
    pintarGuia(r.faltantes);
    feedback("bad", "🙈", "Falta");
    decir("Todavía falta. Seguí por la parte amarilla.");
  }
  // Al segundo intento que no sale, el dedito le enseña el camino (la voz lo dice después de la pista)
  if (fallos === 2) { const esta = ronda; setTimeout(() => { if (esta === ronda && !listo && fallos === 2) { trazos = []; pintarTinta(); mostrarCamino(); } }, 2200); }
});

$("borrarBtn").addEventListener("click", () => {
  if (listo) return;
  trazos = []; pintarTinta(); pintarGuia(null); feedback("");
});

// ---------- ✍️ Mi nombre ----------
// Sale del perfil, o lo escribe el papá. Se guarda solo en este dispositivo, por perfil.
const claveNombre = () => `alt-trazos-nombre-${perfilActivo()?.id || "sin-perfil"}`;
function leerNombre() {
  let n = "";
  try { n = localStorage.getItem(claveNombre()) || ""; } catch (_) {}
  return (n || perfilActivo()?.nombre || "").trim().slice(0, 20);
}
/** Las letras que se pueden trazar (con espacios entre palabras) y lo que se salta. */
function partirNombre(n) {
  const ls = [], omitidas = [];
  for (const c of Array.from(String(n).normalize("NFC"))) {
    // Una letra con una marca que no tenemos (è, ö, ç…) se traza sin la marca
    const ch = tieneTrazos(c) ? c : c.normalize("NFD")[0];
    if (/\s/.test(c) || c === "-") { if (ls.length && ls[ls.length - 1] !== " ") ls.push(" "); } // Ana-Sofía: un huequito
    else if (/\p{L}/u.test(c) && tieneTrazos(ch)) ls.push(ch);
    else if (!omitidas.includes(c)) omitidas.push(c);
  }
  while (ls[ls.length - 1] === " ") ls.pop();
  return { letras: ls, omitidas };
}

function pedirNombre() {
  turno++; ronda++;
  listo = true; letras = []; geo = null; item = null;
  ayuda.parar();
  $("dedo").hidden = true;
  gctx.clearRect(0, 0, S, S); tctx.clearRect(0, 0, S, S);
  $("palabra").hidden = true;
  $("ayuda").replaceChildren();
  $("nombreForm").hidden = false; $("cambiarNombre").hidden = true;
  $("nombreIn").value = leerNombre();
  feedback("");
  instruccion("✍️ ¿Cómo se llama? Un adulto lo escribe abajo.", "Pedile a un adulto que escriba tu nombre abajo, y después lo trazás vos.");
  $("nombreIn").focus();
}

$("nombreForm").addEventListener("submit", e => {
  e.preventDefault();
  const n = $("nombreIn").value.trim().slice(0, 20);
  if (!partirNombre(n).letras.length) { feedback("almost", "✍️", "Escribí un nombre con letras"); $("nombreIn").focus(); return; }
  try { localStorage.setItem(claveNombre(), n); } catch (_) {}
  nuevo();
});
$("cambiarNombre").addEventListener("click", pedirNombre);

// ---------- Rondas ----------
function nuevo() {
  turno++;
  if (nivel === "nombre") {
    nombre = leerNombre();
    const p = partirNombre(nombre);
    if (!p.letras.length) { pedirNombre(); return; }
    $("nombreForm").hidden = true; $("cambiarNombre").hidden = false;
    nombre = p.letras.join(""); // lo que se traza (sin lo que se salta)
    item = { esNombre: true, letras: p.letras, palabra: nombre, omitidas: p.omitidas };
    tol = TOL_MANUAL; conPunto = true; pideOrden = false;
  } else if (nivel === "auto") {
    // Escalera: una al azar del escalón (sin repetir la de antes)
    const e = ESCALONES[esc.nivel], antes = item;
    tol = e.tol; conPunto = !!e.punto; pideOrden = !!e.orden;
    do item = e.lista[Math.floor(Math.random() * e.lista.length)]; while (item === antes && e.lista.length > 1);
  } else {
    const lista = SETS[nivel];
    tol = TOL_MANUAL; conPunto = false; pideOrden = false;
    item = lista[idx % lista.length]; idx++;
  }
  letras = item.letras; li = 0; hechas = []; fallosMax = 0; ayudaRonda = false; rondaLista = false;
  pintarAyuda();
  feedback("");
  $("nextBtn").classList.remove("pulse");
  empezarLetra();
}

// El dibujito de la esquina: el ejemplo, las manzanas del número o el avatar con el nombre
function pintarAyuda() {
  const caja = $("ayuda"), dibujo = document.createElement("span"), texto = document.createElement("small");
  if (item.esNombre) { dibujo.textContent = perfilActivo()?.avatar || "✍️"; texto.textContent = nombre; }
  else if (item.e) { dibujo.textContent = item.e; texto.textContent = item.pal; }
  else if (item.n) { texto.textContent = "🍎".repeat(item.n); texto.style.cssText = "font-size:1.4rem;letter-spacing:-2px"; }
  caja.replaceChildren(dibujo, texto);
}

function empezarLetra() {
  ronda++;
  const ch = letras[li];
  geo = medir(ch);
  trazos = []; actual = null; listo = false; fallos = 0; mostroCamino = false; avisoOrden = false;
  $("dedo").hidden = true;
  pintarGuia(); pintarTinta(); pintarPalabra();
  const primera = li === 0, d = dLetra();
  if (item.esNombre) {
    const salta = primera && item.omitidas.length ? ` Nos saltamos «${item.omitidas.join(" ")}»: aquí solo trazamos letras.` : "";
    instruccion(`Trazá tu nombre: <b>${escapar(nombre)}</b>`, primera ? `Vamos a escribir tu nombre: ${nombre}.${salta} Empezá por ${d}.` : `Ahora ${d}.`);
    if (salta) feedback("", "💡", escapar(salta.trim()));
  } else if (letras.length > 1) {
    const cual = item.pal !== item.palabra ? `${item.palabra}, de ${item.pal}` : item.palabra;
    instruccion(`Trazá <b>${escapar(item.palabra)}</b>`, primera ? `Vamos a escribir ${cual}. Empezá por ${d}.` : `Ahora ${d}.`);
  } else if (item.e) {
    instruccion(`Trazá <b>${escapar(ch)}</b>`, `Trazá ${d}, de ${item.pal}.`);
  } else {
    instruccion(`Trazá <b>${escapar(ch)}</b>`, `Trazá ${d}.`);
  }
  ayuda.empezar();
}

$("nextBtn").addEventListener("click", () => {
  // Pasar a otra después de que no le salió cuenta como ronda difícil (si no, saltar evitaría bajar)
  if (item && !rondaLista && (fallos > 0 || fallosMax > 0)) esc.resultado({ fallos: 2 });
  nuevo();
});
niveles(v => {
  nivel = v; esc.activa = v === "auto"; idx = 0;
  $("nombreZona").hidden = v !== "nombre";
  nuevo();
});

alEmpezar(nuevo);

if (new URLSearchParams(location.search).has("prueba")) window.__trazos = { evaluar, caminoDeLetra, decirLetra, partirNombre, ESCALONES, SETS,
  get geo() { return geo; }, get trazos() { return geo?.trazos; }, get item() { return item; }, get tol() { return tol; }, get nivel() { return esc.nivel; },
  get fallos() { return fallos; }, get listo() { return listo; }, get letras() { return letras; }, get li() { return li; }, get rondaLista() { return rondaLista; },
  get hechas() { return hechas; }, S, Q,
  // Para las pruebas: cómo evalúa una letra trazada completa y quitándole cada trazo
  probarLetra(ch) {
    const antes = geo; geo = medir(ch);
    const r = { completa: evaluar(geo.trazos), sinUno: geo.trazos.length > 1 ? geo.trazos.map((_, k) => evaluar(geo.trazos.filter((_, j) => j !== k))) : [] };
    geo = antes;
    return r;
  } };
</script>
