<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi comunidad</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/prepa.css">
<style>
  :root { --materia: #F29A1F; }
  [hidden] { display: none !important; }
  .instr .txt b { color: var(--materia); }

  /* Lo que pasa: un dibujo grande (o el semáforo) y el texto para el adulto */
  .escena {
    margin-top: 10px; background: var(--face); color: var(--ink); border: 4px solid var(--rim); border-radius: 22px;
    padding: 10px 12px; display: flex; gap: 12px; align-items: center; min-height: 84px;
  }
  .escena .grande { font-size: clamp(2.6rem, 13vw, 3.4rem); line-height: 1; flex: none; position: relative; }
  .escena .semaforo { width: clamp(46px, 13vw, 58px); flex: none; }
  .escena .semaforo svg { width: 100%; display: block; }
  .escena .txt { font-size: clamp(1.02rem, 4.4vw, 1.2rem); font-weight: 700; line-height: 1.3; }
  .escena .txt b { display: block; margin-top: 4px; color: var(--materia); }

  /* Opciones: personas, lugares y servicios (dibujo + nombre), acciones (lista) o números */
  .opciones { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 10px; margin-top: 12px; }
  .opciones.lista { grid-template-columns: 1fr; }
  .opciones button { border-radius: 22px; }
  .opciones button.ficha { padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 118px; justify-content: center; }
  .opciones .ico { font-size: clamp(2.8rem, 14vw, 3.6rem); line-height: 1.05; position: relative; display: inline-block; }
  .marca { position: absolute; right: -.45em; top: -.2em; font-size: .5em; background: var(--face); border: 2px solid var(--rim); border-radius: 50%; padding: 0 .08em; line-height: 1.15; }
  .opciones .nom { font-size: .95rem; font-weight: 800; line-height: 1.1; min-height: 1.1rem; }
  .opciones.ocultar .nom { visibility: hidden; }
  .opciones.ocultar.revelar .nom, .opciones.ocultar button.wrong .nom { visibility: visible; }
  .opciones button.accion { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; font-size: clamp(1rem, 4.4vw, 1.12rem); line-height: 1.2; }
  .opciones button.accion .e { font-size: 2.2rem; line-height: 1; flex: none; }
  .opciones button.numero { font-size: clamp(1.9rem, 9vw, 2.4rem); padding: 14px 4px; letter-spacing: 1px; }
  .opciones button.dicho { outline: 4px solid var(--btn); outline-offset: 2px; }

  /* 🔍 ¿Qué está mal? El dibujo del barrio, en cuatro cuadritos */
  .opciones.dibujo {
    grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; border: 4px solid var(--rim); border-radius: 24px;
    background: linear-gradient(#BEE6FF 0 45%, #A8DD8E 45% 100%);
  }
  .opciones button.vineta {
    border-radius: 18px; min-height: 128px; padding: 6px; background: rgba(255, 255, 255, .78);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .vineta .e { font-size: clamp(2.3rem, 11vw, 3rem); line-height: 1; letter-spacing: -2px; }
  .vineta .semaforo { width: clamp(30px, 8vw, 38px); flex: none; }
  .vineta .semaforo svg { width: 100%; display: block; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="start" id="start">
  <div class="big" aria-hidden="true">👩‍🚒🏫🚦</div>
  <h1>Mi comunidad</h1>
  <button id="startBtn" aria-label="Empezar">▶️</button>
  <p>Subile el volumen 🔊. Las personas que nos ayudan, los lugares del barrio, cómo cuidarlo y cómo cuidarnos en la calle.</p>
</div>

<div class="wrap top">
  <div class="levels" role="group" aria-label="Nivel">
    <button class="auto" data-nivel="auto" aria-pressed="true" aria-label="De a poquito: sube solo">🪜</button>
    <button data-nivel="oficios" aria-label="Personas que nos ayudan">👩‍🚒</button>
    <button data-nivel="lugares" aria-label="Lugares del barrio">🏫</button>
    <button data-nivel="seguridad" aria-label="Cuidarnos en la calle y en la casa">🚦</button>
    <button data-nivel="cuidar" aria-label="Servicios y cuidar el barrio">♻️</button>
    <button data-nivel="historias" aria-label="Historias y ¿qué está mal?">🔍</button>
  </div>
  <div class="escalera" id="escalera"></div>
  <div class="stars" id="stars">⭐ 0</div>
</div>

<div class="wrap instr"><button class="oir" id="oir" aria-label="Escuchar otra vez">🔊</button><button class="lento" id="lento" aria-label="Escuchar despacio">🐢</button><div class="txt" id="instr"></div></div>
<div class="wrap escena" id="escena" hidden></div>
<div class="wrap opciones" id="opciones"></div>
<div class="wrap feedback" id="feedback" aria-live="polite"></div>
<div class="wrap bottom"><button id="nextBtn" aria-label="Otro">➡️</button></div>

<script type="module">
import { hablar, elogio, sonido, LENTO } from "../js/voz.js";
import { decir, instruccion, feedback, estrellas, niveles, alEmpezar, azar, senalar, ayudaSiSeQueda } from "../js/prepa.js";
import { escalera } from "../js/escalera.js";
import { ESCALONES, MODOS, inicio, ronda, porQueNo, semaforo } from "../js/comunidad.js";

const $ = id => document.getElementById(id);

// 🪜 De a poquito: de «¿quién es?» con dos dibujos hasta «¿qué está mal en el dibujo?» (ver ESCALONES en js/comunidad.js)
const esc = escalera("comunidad", { escalones: ESCALONES.length, inicio });
const stars = estrellas("comunidad-stars");

let manual = "oficios", r = null, fallos = 0, listo = false, turno = 0, clave = "";
const botonDe = id => $("opciones").querySelector(`[data-id="${id}"]`);
// Si se queda pegado: se repite lo que pasa (y las opciones), y después se le señala la respuesta
const ayuda = ayudaSiSeQueda({ repetir: () => presentar(false), senalar: () => senalar(botonDe(r.meta)) });

const sem = luz => `<span class="semaforo" role="img" aria-label="Semáforo con el muñequito en ${luz === "roja" ? "rojo" : "verde"}">${semaforo(luz)}</span>`;
const dibujo = (e, marca) => `<span class="ico" aria-hidden="true">${e}${marca ? `<span class="marca">${marca}</span>` : ""}</span>`;

function pintar() {
  const caja = $("escena");
  if (!r.escena) { caja.hidden = true; caja.innerHTML = ""; }
  else {
    caja.hidden = false;
    const izq = r.escena.luz ? sem(r.escena.luz)
      : `<span class="grande" aria-hidden="true">${r.escena.e}${r.escena.marca ? `<span class="marca">${r.escena.marca}</span>` : ""}</span>`;
    caja.innerHTML = `${izq}<span class="txt">${r.escena.html}</span>`;
  }
  const ops = $("opciones"), tipo0 = r.opciones[0].tipo;
  const lista = tipo0 === "accion";
  ops.className = "wrap opciones" + (lista ? " lista" : "") + (r.ocultar ? " ocultar" : "") + (r.tipo === "mal" ? " dibujo" : "");
  ops.style.setProperty("--n", r.opciones.length === 4 ? 2 : r.opciones.length);
  ops.innerHTML = r.opciones.map(o => {
    if (o.tipo === "accion") return `<button class="accion" data-id="${o.id}"><span class="e" aria-hidden="true">${o.e}</span><span>${o.nom}</span></button>`;
    if (o.tipo === "numero") return `<button class="numero" data-id="${o.id}" aria-label="${o.voz}">${o.nom}</button>`;
    if (o.tipo === "vineta") return `<button class="vineta" data-id="${o.id}" aria-label="${o.nom}">${o.luz ? sem(o.luz) : ""}<span class="e" aria-hidden="true">${o.e}</span></button>`;
    return `<button class="ficha" data-id="${o.id}" aria-label="${o.voz}">${dibujo(o.e, o.marca)}<span class="nom" aria-hidden="true">${o.nom}</span></button>`;
  }).join("");
}

function nuevo() {
  const i = esc.activa ? esc.nivel : azar(MODOS[manual]);
  r = ronda(i, Math.random, clave);
  clave = r.clave;
  fallos = 0; listo = false;
  pintar();
  feedback("");
  $("nextBtn").classList.remove("pulse");
  presentar(false);
  ayuda.empezar();
}

// Dice la pregunta y, si hace falta, lee las opciones una por una (para los que no leen)
async function presentar(lento = false) {
  const t = ++turno, actual = r;
  const op = lento ? { rate: LENTO } : undefined;
  await instruccion(r.instr, r.voz, lento);
  if (t !== turno || r !== actual || !r.leer) return;
  const btns = [...$("opciones").querySelectorAll("button")];
  for (const b of btns) {
    if (t !== turno || r !== actual) break;
    if (b.disabled) continue;
    b.classList.add("dicho");
    await hablar(r.opciones.find(o => o.id === b.dataset.id).voz, op);
    b.classList.remove("dicho");
  }
  btns.forEach(b => b.classList.remove("dicho"));
}

$("opciones").addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (!b || listo || b.disabled) return;
  turno++; // deja de leer las opciones
  $("opciones").querySelectorAll(".dicho").forEach(x => x.classList.remove("dicho"));
  const id = b.dataset.id;
  if (id === r.meta) {
    listo = true;
    ayuda.parar();
    b.classList.remove("senal");
    b.classList.add("right");
    $("opciones").classList.add("revelar");
    $("opciones").querySelectorAll("button").forEach(x => { if (x !== b) x.disabled = true; });
    if (fallos === 0 && !ayuda.usada) {
      const bien = r.tipo === "mal" ? "¡Lo encontraste!" : elogio();
      stars.sumar(); feedback("ok", "🎉", bien); decir(`${bien} ${r.explica}`);
    } else { feedback("almost", "🤏", "¡Ahora sí!"); decir(`¡Ahora sí! ${r.explica}`); }
    esc.resultado({ fallos, ayuda: ayuda.usada, opciones: r.opciones.length });
    $("nextBtn").classList.add("pulse");
  } else {
    fallos++;
    b.classList.add("wrong", "nope"); b.disabled = true;
    if (r.tipo === "mal") feedback("bad", "👍", "Eso está bien");
    else feedback("bad", "🤔", r.opciones[0].tipo === "accion" ? "Eso no" : "No es");
    decir(porQueNo(r, id));
    // Al segundo error se le señala la respuesta
    if (fallos >= 2) senalar(botonDe(r.meta));
  }
});

$("nextBtn").addEventListener("click", () => {
  // Saltarse una ronda después de equivocarse cuenta como ronda difícil
  if (r && !listo && fallos > 0) esc.resultado({ fallos: 2 });
  sonido("tap");
  nuevo();
});
niveles(v => {
  esc.activa = v === "auto";
  if (v !== "auto") manual = v;
  clave = ""; nuevo();
});

alEmpezar(nuevo, presentar);

if (new URLSearchParams(location.search).has("prueba")) window.__comunidad = { get r() { return r; }, get nivel() { return esc.nivel; }, get fallos() { return fallos; } };
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
