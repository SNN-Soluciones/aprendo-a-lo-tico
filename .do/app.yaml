# Spec de DigitalOcean App Platform (sitio estático, sin build).
# Cambiá "SNN-Soluciones" por tu usuario u organización de GitHub.
name: aprendo-a-lo-tico
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
static_sites:
  - name: web
    environment_slug: html
    github:
      repo: SNN-Soluciones/aprendo-a-lo-tico
      branch: main
      deploy_on_push: true
    source_dir: /public
    index_document: index.html
    error_document: 404.html
