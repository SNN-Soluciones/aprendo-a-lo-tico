<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fracciones con pizza y sandía</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/prepa.css">
<style>
  :root { --materia: #2F7FD1; }
  .ancho { width: min(96vw, 560px); }
  .levels button { font-size: 1rem; padding: 2px 9px; }

  /* Fracciones escritas: numerador sobre denominador */
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .12em; font-weight: 800; }
  .fr .nu { padding: 0 .18em .06em; border-bottom: .11em solid currentColor; min-width: .7em; text-align: center; }
  .fr .de { padding: .06em .18em 0; min-width: .7em; text-align: center; }
  .fr.falta .nu, .fr.falta .de { color: var(--materia); }
  .mixto { display: inline-flex; align-items: center; font-weight: 800; }
  .hueco-signo { display: inline-block; min-width: 1.5em; text-align: center; color: var(--materia); border-bottom: 4px dashed var(--materia); vertical-align: middle; }
  .instr .txt { font-size: clamp(1.05rem, 4.6vw, 1.3rem); }

  /* Escena: dibujos */
  .escena {
    margin-top: 10px; background: var(--face); border: 4px solid var(--rim); border-radius: 22px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 120px;
  }
  .figura { display: block; overflow: visible; }
  .figura.pizza { width: min(64vw, 250px); }
  .figura.sandia { width: min(80vw, 320px); }
  .figura.barra { width: min(86vw, 420px); }
  .figura .parte { fill: var(--vacio); stroke: #fff; stroke-width: 1.4; transition: fill .15s; }
  .figura .parte.pintada { fill: var(--lleno); }
  .figura [data-p] { cursor: pointer; }
  .figura [data-p]:focus-visible { outline: none; stroke: var(--materia); stroke-width: 3; }
  .figura .parte.guia { animation: guia .9s ease-in-out infinite; }
  @keyframes guia { 50% { fill: #FFE08A; } }
  .figura.chica.pizza { width: min(26vw, 110px); }
  .figura.mini.barra { width: min(40vw, 190px); }
  .contador { font-weight: 800; font-size: 1.1rem; }
  .pizzas { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  .grupos { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .grupo {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0; max-width: 132px; padding: 4px 6px;
    border: 3px dashed var(--soft); border-radius: 16px; background: #fff; box-shadow: none; font-size: clamp(1.4rem, 7vw, 1.9rem); line-height: 1.15;
  }
  .grupo.marcado { border-style: solid; border-color: var(--materia); background: #DCEBFF; }
  .grupo:active { transform: scale(.97); box-shadow: none; }

  .comparar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; align-items: end; }
  .comparar > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 2rem; }
  .comparar .figura.barra { width: 100%; }
  .barras { display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; }
  .barras .fila { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; font-size: 1.6rem; }
  .barras .fila .figura.barra { width: min(70vw, 340px); }
  .barras .fila .fr { min-width: 2.2em; }
  .grande { font-size: 2.4rem; }

  /* Respuestas */
  .opciones { display: grid; gap: 10px; margin-top: 12px; grid-template-columns: repeat(var(--n, 3), 1fr); }
  .opciones button { font-size: 1.8rem; padding: 8px 4px; border-radius: 18px; line-height: 1.1; }
  .opciones button small { display: block; font-size: .8rem; font-weight: 700; }
  .opciones button b { font-size: 2.2rem; display: block; line-height: 1; }
  .acciones { display: flex; gap: 10px; margin-top: 12px; }
  .acciones button { flex: 1; font-size: 1.3rem; padding: 8px 0; border-radius: 18px; }
  .acciones .ok { flex: 2; background: var(--btn); }
  .pantalla { margin-top: 12px; text-align: center; font-size: 2.2rem; font-weight: 800; background: var(--face); border: 4px solid var(--rim); border-radius: 18px; min-height: 3.2rem; }
  .pantalla .ph { opacity: .35; }
  .pantalla.right { background: #C9F2D6; border-color: var(--ok); }
  .pantalla.wrong { background: #FBD5D1; }
  .teclado { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .teclado button { font-size: 1.7rem; padding: 4px 0; border-radius: 16px; }
  .teclado .ok { background: var(--btn); }
  .explica { margin-top: 10px; background: #FFF6DA; color: #3B2F00; border: 3px dashed #D9A400; border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 1.05rem; line-height: 1.4; }
  .explica .fr { font-size: 1.05em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="start" id="start">
  <div class="big" aria-hidden="true">🍕🍉🍫</div>
  <h1>Fracciones con pizza y sandía</h1>
  <button id="startBtn" aria-label="Empezar">▶️</button>
  <p>Pintá, compará y sumá pedazos de pizza, sandía y chocolate. Sube de nivel de a poquito. Subile el volumen 🔊.</p>
</div>

<div class="wrap top ancho">
  <div class="levels" role="group" aria-label="Tema">
    <button class="auto" data-nivel="auto" aria-pressed="true" aria-label="De a poquito: sube solo">🪜</button>
    <button data-nivel="pintar" aria-label="Pintar y leer fracciones">🍕</button>
    <button data-nivel="grupo" aria-label="Fracción de un grupo">🥭</button>
    <button data-nivel="comparar" aria-label="Comparar fracciones">⚖️</button>
    <button data-nivel="equiv" aria-label="Equivalentes y simplificar">🟰</button>
    <button data-nivel="sumar" aria-label="Sumar y restar">➕</button>
    <button data-nivel="mixtos" aria-label="Números mixtos">🍕🍕</button>
  </div>
  <div class="escalera" id="escalera"></div>
  <div class="stars" id="stars">⭐ 0</div>
</div>

<div class="wrap instr ancho"><button class="oir" id="oir" aria-label="Escuchar otra vez">🔊</button><button class="lento" id="lento" aria-label="Escuchar despacio">🐢</button><div class="txt" id="instr"></div></div>
<div class="escena ancho" id="escena"></div>
<div class="ancho" id="respuesta"></div>
<div class="wrap feedback ancho" id="feedback" aria-live="polite"></div>
<div class="explica ancho" id="explica" hidden aria-live="polite"></div>
<div class="wrap bottom"><button id="nextBtn" aria-label="Otra">➡️</button></div>

<script type="module">
import { elogio, sonido } from "../js/voz.js";
import { decir, instruccion, feedback, estrellas, niveles, alEmpezar, senalar, ayudaSiSeQueda } from "../js/prepa.js";
import { escalera } from "../js/escalera.js";
import { ESCALONES, inicioPorEdad, ronda, figura, fr, mixtoHTML, enPalabras, colones } from "../js/fracciones.js";

const $ = id => document.getElementById(id);
// Barras delgadas de chocolate, para poner varias una debajo de la otra
const barra = (d, pintadas) => figura("chocolate", d, pintadas, { bajita: true });

// Temas a mano (para el papá o la maestra): escalones que se van turnando
const TEMAS = { pintar: [0, 1, 2, 3], grupo: [4, 6, 10], comparar: [5, 7, 11], equiv: [8, 13], sumar: [9], mixtos: [12] };

const esc = escalera("fracciones", { escalones: ESCALONES.length, inicio: inicioPorEdad });
const stars = estrellas("fracciones-stars");
// Los grandes piensan un rato antes de tocar: la ayuda espera más que en los juegos de Prepa
const ayuda = ayudaSiSeQueda({ senalar: () => mostrarAyuda(), espera: 15000 });

let tema = "auto", r = null, fallos = 0, listo = false, ultimoTipo = "";
let pintadas = new Set(), tecleado = "";
const dentroTema = { pintar: 0, grupo: 0, comparar: 0, equiv: 0, sumar: 0, mixtos: 0 };

// ---------- Ronda nueva ----------
function nuevo() {
  let i;
  if (esc.activa) i = esc.nivel;
  else { const lista = TEMAS[tema]; i = lista[dentroTema[tema]++ % lista.length]; }
  let intentos = 0;
  do r = ronda(i); while (r.tipo + (r.n ?? "") + (r.d ?? "") === ultimoTipo && ++intentos < 10);
  ultimoTipo = r.tipo + (r.n ?? "") + (r.d ?? "");
  fallos = 0; listo = false; pintadas = new Set(); tecleado = "";
  feedback(""); $("explica").hidden = true; $("nextBtn").classList.remove("pulse");
  pintarEscena(); pintarRespuesta();
  instruccion(r.html, r.voz);
  ayuda.empezar();
}

// Partes pintadas de muestra: juntas en los primeros escalones, revueltas después (hay que contar)
function muestra(n, d) {
  if (r.escalon < 3) return Array.from({ length: n }, (_, i) => i);
  const todas = Array.from({ length: d }, (_, i) => i).sort(() => Math.random() - 0.5);
  return todas.slice(0, n);
}

function pintarEscena() {
  const e = $("escena");
  e.hidden = false;
  switch (r.tipo) {
    case "pintar":
      e.innerHTML = `${figura(r.forma, r.d, [...pintadas], { toca: true })}<div class="contador" id="contador"></div>`;
      contar(); break;
    case "cual":
      e.innerHTML = figura(r.forma, r.d, muestra(r.n, r.d)); break;
    case "grupo":
      if (r.dibujo) e.innerHTML = `<div class="grupos">${Array.from({ length: r.d }, (_, g) =>
        `<button class="grupo" data-g="${g}" aria-label="Grupo ${g + 1}">${r.cosa.e.repeat(r.k)}</button>`).join("")}</div>`;
      else e.innerHTML = `<div class="grande" aria-hidden="true">${r.dinero ? "💰" : r.cosa.e}</div>`;
      break;
    case "comparar":
      e.innerHTML = r.dibujo
        ? `<div class="comparar"><div>${fr(r.a.n, r.a.d)}${barra(r.a.d, r.a.n)}</div><div>${fr(r.b.n, r.b.d)}${barra(r.b.d, r.b.n)}</div></div>`
        : `<div class="grande" aria-hidden="true">⚖️</div>`;
      break;
    case "equivalente":
      e.innerHTML = `<div class="barras"><div class="fila">${fr(r.de.n, r.de.d)}${barra(r.de.d, r.de.n)}</div>
        <div class="fila" id="filaMeta">${fr("?", r.a.d, " falta")}${barra(r.a.d, 0)}</div></div>`;
      break;
    case "sumar":
      e.innerHTML = `<div class="barras"><div class="fila">${fr(r.x, r.d)}${barra(r.d, r.x)}</div>
        <div class="fila">${fr(r.y, r.d)}${barra(r.d, r.y)}</div>
        <div class="fila" id="filaMeta">${fr("?", r.d, " falta")}${barra(r.d, 0)}</div></div>`;
      break;
    case "mixto":
      e.innerHTML = `<div class="pizzas">${Array.from({ length: r.e }, () => figura("pizza", r.d, r.d, { extra: "chica" })).join("")}${figura("pizza", r.d, r.n, { extra: "chica" })}</div>`;
      break;
    case "simplificar":
      e.innerHTML = `<div class="barras"><div class="fila">${fr(r.de.n, r.de.d)}${barra(r.de.d, r.de.n)}</div>
        <div class="fila" id="filaMeta" hidden>${fr(r.a.n, r.a.d)}${barra(r.a.d, r.a.n)}</div></div>`;
      break;
  }
}

function pintarRespuesta() {
  const c = $("respuesta");
  if (r.tipo === "pintar") {
    c.innerHTML = `<div class="acciones"><button id="borrarBtn" aria-label="Borrar lo pintado">🧽</button><button class="ok" id="revisarBtn">✔️ Revisar</button></div>`;
  } else if (r.opciones) {
    c.innerHTML = `<div class="opciones" style="--n:${r.opciones.length === 4 ? 2 : r.opciones.length}">${r.opciones.map(o =>
      `<button data-id="${o.id}" aria-label="${o.voz}">${o.html}</button>`).join("")}</div>`;
  } else {
    c.innerHTML = `<div class="pantalla" id="pantalla"></div><div class="teclado" id="teclado">${
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-t="${n}">${n}</button>`).join("")}<button data-t="borrar" aria-label="Borrar">⌫</button><button data-t="0">0</button><button class="ok" data-t="ok" aria-label="Revisar">✔️</button></div>`;
    pantalla();
  }
}

const pantalla = () => { $("pantalla").innerHTML = tecleado ? `${r.prefijo || ""}${r.prefijo ? colones(tecleado).slice(1) : tecleado}` : `<span class="ph">${r.prefijo || ""}?</span>`; };
function contar() { $("contador").textContent = `Pintadas: ${pintadas.size} de ${r.d}`; }

// ---------- Tocar ----------
$("escena").addEventListener("click", e => {
  const p = e.target.closest("[data-p]");
  if (p && r.tipo === "pintar" && !listo) {
    const i = Number(p.dataset.p);
    if (pintadas.has(i)) pintadas.delete(i); else pintadas.add(i);
    sonido("tap");
    p.classList.toggle("pintada", pintadas.has(i));
    p.classList.remove("guia");
    contar();
    return;
  }
  const g = e.target.closest("[data-g]");
  if (g) { g.classList.toggle("marcado"); sonido("tap"); }
});
$("escena").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.closest("[data-p]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

$("respuesta").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || listo || b.disabled) return;
  if (b.id === "borrarBtn") { pintadas.clear(); sonido("tap"); pintarEscena(); return; }
  if (b.id === "revisarBtn") return revisarPintado();
  if (b.dataset.id) return elegir(b);
  if (b.dataset.t) {
    const t = b.dataset.t;
    if (t === "borrar") tecleado = tecleado.slice(0, -1);
    else if (t === "ok") return revisarNumero();
    else if (tecleado.length < 6) tecleado = (tecleado === "0" ? "" : tecleado) + t;
    sonido("tap"); $("pantalla").classList.remove("wrong"); pantalla();
  }
});

// ---------- Revisar ----------
function revisarPintado() {
  const k = pintadas.size;
  if (k === r.n) return acertar();
  fallos++;
  if (k === 0) { fallos--; decir("Primero tocá las partes para pintarlas."); return; }
  if (k === r.d - r.n) { feedback("almost", "🤏", "¡Casi!"); decir(`¡Casi! Pintaste ${k} de ${r.d}: eso es ${enPalabras(k, r.d)}. ${r.pista}`); }
  else { feedback("bad", "🤔", `Pintaste ${k} de ${r.d}`); decir(`Pintaste ${k === 1 ? "una parte" : `${k} partes`} de ${r.d}: eso es ${enPalabras(k, r.d)}. ${r.pista}`); }
  if (fallos >= 2) guiar();
}

function elegir(b) {
  const o = r.opciones.find(x => x.id === b.dataset.id);
  if (o.id === String(r.correcta)) { b.classList.remove("senal"); b.classList.add("right"); return acertar(b); }
  fallos++;
  b.classList.add("wrong", "nope"); b.disabled = true;
  const cerca = typeof o.v === "number" && Math.abs(o.v - Number(r.correcta)) === 1;
  if (cerca) feedback("almost", "🤏", "¡Casi!"); else feedback("bad", "🤔", "No es");
  decir(`${cerca ? "¡Casi!" : "Esa no es."} ${r.pista}`);
  if (fallos >= 2) senalar($("respuesta").querySelector(`[data-id="${r.correcta}"]`));
}

function revisarNumero() {
  if (!tecleado) { decir("Escribí el número con las teclas."); return; }
  if (Number(tecleado) === r.numero) { $("pantalla").classList.add("right"); return acertar(); }
  fallos++;
  $("pantalla").classList.add("wrong");
  const cerca = Math.abs(Number(tecleado) - r.numero) <= (r.prefijo ? 0 : 1);
  if (cerca) feedback("almost", "🤏", "¡Casi!"); else feedback("bad", "🤔", "No es");
  if (fallos >= 2) {
    // Segunda vez: se muestra cómo se hace y la respuesta (sin regaños)
    tecleado = String(r.numero); pantalla(); $("pantalla").classList.remove("wrong"); $("pantalla").classList.add("right");
    return acertar(null, true);
  }
  decir(`${cerca ? "¡Casi!" : "Revisá."} ${r.pista}`);
  tecleado = ""; setTimeout(() => { if (!listo) pantalla(); }, 900);
}

function acertar(boton = null, mostrado = false) {
  listo = true;
  ayuda.parar();
  const limpio = fallos === 0 && !ayuda.usada;
  if (limpio) { const bien = elogio(); stars.sumar(); feedback("ok", "🎉", bien); decir(`${bien} ${r.vozExplica}`); }
  else if (mostrado) { feedback("almost", "💡", "Así se hace"); decir(`Mirá cómo se hace. ${r.vozExplica}`); }
  else { feedback("almost", "🤏", "¡Ahora sí!"); decir(`¡Ahora sí! ${r.vozExplica}`); }
  $("explica").hidden = false; $("explica").innerHTML = r.explica;
  $("respuesta").querySelectorAll("button").forEach(x => { if (x !== boton) x.disabled = true; });
  completarDibujo();
  esc.resultado({ fallos, ayuda: ayuda.usada, opciones: r.opciones?.length || 0 });
  $("nextBtn").classList.add("pulse");
}

// Al terminar, se completa lo que faltaba en la pregunta y en el dibujo
function completarDibujo() {
  const hueco = $("instr").querySelector(".hueco-signo");
  if (hueco) hueco.outerHTML = r.tipo === "comparar" ? `<b>${r.correcta}</b>` : r.opciones.find(o => o.id === r.correcta).html;
  const falta = $("instr").querySelector(".fr.falta .nu");
  if (falta) falta.textContent = r.tipo === "sumar" ? r.res : r.a.n;
  const meta = $("filaMeta");
  if (meta) {
    meta.hidden = false;
    if (r.tipo === "equivalente") meta.innerHTML = `${fr(r.a.n, r.a.d)}${barra(r.a.d, r.a.n)}`;
    if (r.tipo === "sumar") meta.innerHTML = `${fr(r.res, r.d)}${barra(r.d, r.res)}`;
  }
  if (r.tipo === "pintar") $("escena").querySelectorAll("[data-p]").forEach(p => p.classList.remove("guia"));
}

// ---------- Ayudas ----------
function guiar() {
  // Pintar: brillan las partes que faltan (o las que sobran)
  const partes = [...$("escena").querySelectorAll("[data-p]")];
  const faltan = r.n - pintadas.size;
  const cuales = faltan > 0 ? partes.filter(p => !pintadas.has(Number(p.dataset.p))).slice(0, faltan) : partes.filter(p => pintadas.has(Number(p.dataset.p))).slice(0, -faltan);
  cuales.forEach(p => p.classList.add("guia"));
}
function mostrarAyuda() {
  if (listo) return;
  if (r.tipo === "pintar") { guiar(); decir(r.pista); }
  else if (r.opciones) senalar($("respuesta").querySelector(`[data-id="${r.correcta}"]`));
  else { feedback("almost", "💡", "Pista"); $("explica").hidden = false; $("explica").textContent = `💡 ${r.pista}`; decir(r.pista); }
}

$("nextBtn").addEventListener("click", () => { sonido("tap"); nuevo(); });
niveles(v => { tema = v; esc.activa = v === "auto"; nuevo(); });
alEmpezar(nuevo);

if (new URLSearchParams(location.search).has("prueba")) window.__fracciones = {
  get r() { return r; }, get nivel() { return esc.nivel; }, get fallos() { return fallos; }, get listo() { return listo; },
  get pintadas() { return [...pintadas]; },
};
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
