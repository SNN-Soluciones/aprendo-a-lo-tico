# PostgreSQL y Mailpit para desarrollar en la compu (perfil local). Los levanta Spring Boot solo al correr `./gradlew bootRun`.
# Estas claves son solo para esta base local de prueba, nunca para producción.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aprendo
      POSTGRES_USER: aprendo
      POSTGRES_PASSWORD: aprendo-local
    # Puerto libre al azar (solo en 127.0.0.1): no choca con otro PostgreSQL de la compu; Spring Boot lo encuentra solo
    ports:
      - "127.0.0.1::5432"
    volumes:
      - datos:/var/lib/postgresql/data
  # Atrapa todos los correos (no manda ninguno de verdad): se ven en http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  datos:
