<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sílabas mágicas</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/prepa.css">
<style>
  :root { --materia: #E8574A; --s1: #E8574A; --s2: #2F7FD1; }
  .levels button { font-size: 1rem; }
  /* Las letras van grandes, en minúscula de imprenta, como en primer grado */
  .letra { font-family: "Baloo 2", "Comic Sans MS", system-ui, sans-serif; text-transform: none; }

  .escena {
    margin-top: 12px; background: var(--face); border: 4px solid var(--rim); border-radius: 22px;
    padding: 10px 8px; min-height: 120px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
  }
  .escena[hidden] { display: none; }
  .escena .dibujo { font-size: clamp(4rem, 22vw, 5.6rem); line-height: 1; width: 100%; text-align: center; }

  /* Fichas: letras y sílabas */
  .ficha {
    font-size: clamp(2.4rem, 13vw, 3.4rem); line-height: 1.1; min-width: 1.6em; padding: 2px 10px;
    border-radius: 18px; text-align: center; color: var(--ink);
  }
  span.ficha { border: 4px solid var(--rim); background: var(--face); box-shadow: 0 4px 0 var(--rim); }
  .ficha.vacia { border: 4px dashed var(--soft); background: #F4F8FB; color: var(--soft); box-shadow: none; }
  .ficha.puesta { animation: pop .4s ease-out; }
  .ficha.s1 { color: var(--s1); }
  .ficha.s2 { color: var(--s2); }
  .ficha.leida { background: #FFF1C2; }
  .ficha.junta { background: #C9F2D6; border-color: var(--ok); }
  .mas { font-size: 2rem; font-weight: 800; color: var(--page-ink); }
  .huecos { display: flex; gap: 6px; justify-content: center; width: 100%; }

  /* Oración: palabras que se tocan */
  .oracion { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .oracion .ficha { font-size: clamp(1.8rem, 9vw, 2.4rem); }

  .opciones { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 12px; margin-top: 14px; }
  .opciones button { border-radius: 24px; padding: 8px 2px; font-size: clamp(2.6rem, 14vw, 3.6rem); line-height: 1.1; }
  .opciones button.dib { font-size: clamp(3.2rem, 17vw, 4.4rem); }
  .opciones button.ficha-op { color: var(--materia); }

  #pistaBtn { background: #FFF6DA; font-size: 1.8rem; padding: 4px 22px; }
  #pistaBtn[hidden] { display: none; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="start" id="start">
  <div class="big letra" aria-hidden="true" style="color:var(--materia)">ma me mi</div>
  <h1>Sílabas mágicas</h1>
  <button id="startBtn" aria-label="Empezar">▶️</button>
  <p>Subile el volumen 🔊. Escuchá y tocá las vocales y las sílabas, armá palabras y empezá a leer, de a poquito.</p>
</div>

<div class="wrap top">
  <div class="levels" role="group" aria-label="Nivel">
    <button class="auto" data-nivel="auto" aria-pressed="true" aria-label="De a poquito: sube solo">🪜</button>
    <button data-nivel="vocales" class="letra" aria-label="Vocales">a e i</button>
    <button data-nivel="silabas" class="letra" aria-label="Sílabas">ma me</button>
    <button data-nivel="armar" aria-label="Armar palabras">🧩</button>
    <button data-nivel="leer" aria-label="Leer">📖</button>
  </div>
  <div class="escalera" id="escalera"></div>
  <div class="stars" id="stars">⭐ 0</div>
</div>

<div class="wrap instr"><button class="oir" id="oir" aria-label="Escuchar otra vez">🔊</button><button class="lento" id="lento" aria-label="Escuchar despacio">🐢</button><div class="txt" id="instr"></div></div>
<div class="wrap escena" id="escena"></div>
<div class="wrap opciones" id="opciones"></div>
<div class="wrap feedback" id="feedback" aria-live="polite"></div>
<div class="wrap bottom"><button id="pistaBtn" aria-label="Ayuda: oír la palabra" hidden>💡</button><button id="nextBtn" aria-label="Otro">➡️</button></div>

<script type="module">
import { hablar, elogio, sonido } from "../js/voz.js";
import { decir, instruccion, feedback, estrellas, niveles, alEmpezar, azar, senalar, ayudaSiSeQueda } from "../js/prepa.js";
import { escalera } from "../js/escalera.js";
import { ESCALONES, NOMBRE, ronda, inicioPorEdad } from "../js/silabas.js";

const $ = id => document.getElementById(id);
const esc = escalera("silabas", { escalones: ESCALONES.length, inicio: inicioPorEdad });
const stars = estrellas("silabas-stars");

// Modos a mano (papá o maestra): cada uno toma escalones al azar de su grupo
const MANUAL = { vocales: [0, 1], silabas: [2, 3, 4, 5, 6, 7, 10, 13], armar: [8, 11], leer: [9, 12, 14, 15] };
let manual = null;

let r = null, num = 0, fallos = 0, listo = false, malos = new Set(), puestas = [], leidas = new Set(), usoPista = false, antes = "";
let usadas = new Set(); // fichas que ya no se pueden tocar al armar (puestas, o que sobraban)

// La letra o sílaba como se dice: «la eme» para una letra sola
const letra = l => `la ${NOMBRE[l]}`;
const dichoDe = s => s; // una sílaba se dice tal cual: «ma»
const ese = p => (p.a === "la" ? "Esa es la" : "Ese es el");
const ficha = (txt, extra = "", attrs = "") => `<span class="ficha letra ${extra}" ${attrs}>${txt}</span>`;

function escalonActual() {
  if (esc.activa) return esc.nivel;
  return azar(MANUAL[manual]);
}

function nuevo() {
  num++;
  r = ronda(escalonActual(), Math.random, antes);
  antes = r.clave;
  fallos = 0; listo = false; malos = new Set(); puestas = []; leidas = new Set(); usoPista = false; usadas = new Set();
  feedback("");
  $("nextBtn").classList.remove("pulse");
  $("pistaBtn").hidden = true;
  pintar();
  presentar();
  ayuda.empezar();
}

// ---------- Pintar ----------
function pintar() {
  const esc_ = $("escena"), op = $("opciones");
  esc_.hidden = false;
  if (r.tipo === "oir") {
    esc_.hidden = true;
    op.style.setProperty("--n", r.opciones.length);
    op.innerHTML = r.opciones.map((o, i) => `<button class="ficha-op letra" data-i="${i}" aria-label="${o}">${o}</button>`).join("");
  } else if (r.tipo === "vocal" || r.tipo === "consonante") {
    const [a, b] = r.tipo === "vocal" ? [r.c, null] : [null, r.v];
    esc_.innerHTML = `${a ? ficha(a, "s1") : ficha("?", "vacia", 'id="hueco"')}<span class="mas" aria-hidden="true">+</span>${b ? ficha(b, "s2") : ficha("?", "vacia", 'id="hueco"')}`;
    op.style.setProperty("--n", r.opciones.length);
    op.innerHTML = r.opciones.map((o, i) => `<button class="ficha-op letra" data-i="${i}" aria-label="${letra(o)}">${o}</button>`).join("");
  } else if (r.tipo === "armar") {
    esc_.innerHTML = `<div class="dibujo" aria-hidden="true">${r.palabra.e}</div><div class="huecos">${r.palabra.s.map((_, k) =>
      ficha(puestas[k] ?? "?", puestas[k] ? `s${(k % 2) + 1} puesta` : "vacia")).join("")}</div>`;
    op.style.setProperty("--n", Math.min(r.fichas.length, 3));
    op.innerHTML = r.fichas.map((s, i) => `<button class="ficha-op letra" data-i="${i}" aria-label="${s}"${usadas.has(i) ? " disabled" : ""}>${s}</button>`).join("");
  } else {
    // leer u oración: las sílabas (o palabras) se tocan; abajo, los dibujos
    const piezas = r.tipo === "leer" ? r.palabra.s : r.palabras;
    esc_.innerHTML = `<div class="${r.tipo === "leer" ? "huecos" : "oracion"}">${piezas.map((s, k) =>
      `<button class="ficha letra s${(k % 2) + 1}${leidas.has(k) ? " leida" : ""}" data-p="${k}" aria-label="${r.voz ? `Escuchar ${s}` : s}">${s}</button>`).join("")}</div>`;
    op.style.setProperty("--n", r.opciones.length);
    op.innerHTML = r.opciones.map((o, i) => `<button class="dib" data-i="${i}" aria-label="${o.t}">${o.e}</button>`).join("");
    $("pistaBtn").hidden = r.voz || listo;
  }
}

// ---------- Decir la consigna ----------
function textos() {
  if (r.tipo === "oir") {
    return r.vocales
      ? { html: `<span class="big">👂</span> ¿Cuál vocal es?`, voz: `Tocá la ${r.meta}... ${r.meta}.` }
      : { html: `<span class="big">👂</span> ¿Cuál sílaba es?`, voz: `Tocá la sílaba ${r.meta}... ${r.meta}.` };
  }
  if (r.tipo === "vocal") return { html: `<span class="big">🧩</span> ¿Qué vocal falta?`, voz: `Armá ${r.silaba}. ${cap(letra(r.c))} ya está. ¿Qué vocal le falta? ${r.silaba}.` };
  if (r.tipo === "consonante") return { html: `<span class="big">🧩</span> ¿Qué letra va antes?`, voz: `Armá ${r.silaba}. ${cap(letra(r.v))} ya está. ¿Qué letra va antes? ${r.silaba}.` };
  if (r.tipo === "armar") return { html: `<span class="big">🧩</span> Armá la palabra`, voz: `Armá la palabra ${r.palabra.t}: tocá las sílabas en orden. ${r.palabra.t}.` };
  if (r.tipo === "leer") return r.voz
    ? { html: `<span class="big">📖</span> Leé y tocá el dibujo`, voz: "Leé la palabra: tocá cada sílaba para oírla, y después tocá su dibujo." }
    : { html: `<span class="big">📖</span> Leé solito`, voz: `Ahora leé solito, con los ojos. Después tocá el dibujo. Si necesitás ayuda, tocá el foco.` };
  return r.voz
    ? { html: `<span class="big">📖</span> Leé la oración`, voz: "Leé la oración: tocá cada palabra para oírla. Después tocá el dibujo que va." }
    : { html: `<span class="big">📖</span> Leé solito`, voz: "Ahora leé la oración solito, con los ojos. Después tocá el dibujo que va. Si necesitás ayuda, tocá el foco." };
}
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function presentar(lento = false) {
  const t = textos();
  return instruccion(t.html, t.voz, lento);
}

// ---------- Ayuda si se queda pegado ----------
function objetivo() {
  if (r.tipo === "armar") {
    const sig = r.palabra.s[puestas.length];
    return [...$("opciones").querySelectorAll("button")].find(b => !b.disabled && r.fichas[Number(b.dataset.i)] === sig);
  }
  if (r.tipo === "leer" || r.tipo === "oracion") {
    if (!r.voz) return $("pistaBtn");
    const falta = $("escena").querySelector("[data-p]:not(.leida)");
    if (falta) return falta;
  }
  return $("opciones").querySelector(`[data-i="${r.opciones.findIndex(o => (typeof o === "string" ? o : o.t) === r.meta)}"]`);
}
const ayuda = ayudaSiSeQueda({ repetir: () => presentar(), senalar: () => senalar(objetivo()) });

// ---------- Respuestas ----------
function bien(b) {
  listo = true; ayuda.parar();
  const yo = num;
  b?.classList.remove("senal");
  b?.classList.add("right");
  $("opciones").querySelectorAll("button").forEach(x => { if (x !== b) x.disabled = true; });
  $("pistaBtn").hidden = true;
  const limpio = fallos === 0 && !ayuda.usada && !usoPista;
  let dicho;
  if (r.tipo === "oir") dicho = r.vocales ? `¡La ${r.meta}!` : `¡${cap(r.meta)}!`;
  else if (r.tipo === "vocal" || r.tipo === "consonante") {
    $("escena").innerHTML = ficha(r.silaba, "junta puesta");
    dicho = `${cap(NOMBRE[r.c])} con ${r.v}: ¡${r.silaba}!`;
  } else if (r.tipo === "armar") dicho = `${r.palabra.s.join(", ")}. ¡${r.palabra.t}!`;
  else if (r.tipo === "leer") dicho = `${r.palabra.s.join(", ")}. ¡${r.palabra.t}!`;
  else dicho = `${r.texto}.`;
  if (limpio) { stars.sumar(); feedback("ok", "🎉", elogio()); decir(`${elogio()} ${dicho}`); }
  else { feedback("almost", "🤏", "¡Ahora sí!"); decir(`¡Ahora sí! ${dicho}`); }
  // Al armar hay varios pasos: un error no es «adivinar entre dos», así que no se pasan las opciones
  esc.resultado({ fallos, ayuda: ayuda.usada || usoPista, opciones: r.opciones ? r.opciones.length : 0 });
  if (yo === num) $("nextBtn").classList.add("pulse");
}

function mal(b, clave, explica) {
  // Tocar otra vez lo mismo que ya estaba mal no cuenta como otro error
  if (!malos.has(clave)) { malos.add(clave); fallos++; }
  b.classList.add("wrong", "nope");
  setTimeout(() => b.classList.remove("nope"), 400);
  feedback(fallos === 1 ? "almost" : "bad", fallos === 1 ? "🤏" : "🙈", fallos === 1 ? "¡Casi!" : "No es");
  decir(explica);
  // Al 2.º error, se le señala lo que va (si sigue siendo la misma ronda)
  const yo = num;
  if (fallos >= 2) setTimeout(() => { if (!listo && yo === num) senalar(objetivo()); }, 300);
}

$("opciones").addEventListener("click", e => {
  const b = e.target.closest("[data-i]");
  if (!b || listo || b.disabled || !r) return;
  const i = Number(b.dataset.i);
  if (r.tipo === "armar") return tocarFicha(b, i);
  const o = r.opciones[i], valor = typeof o === "string" ? o : o.t;
  if (valor === r.meta) return bien(b);
  b.disabled = true;
  if (r.tipo === "oir") mal(b, valor, r.vocales ? `Esa es la ${valor}. Escuchá: ${r.meta}.` : `Esa dice ${valor}. Escuchá: ${r.meta}... ${r.meta}.`);
  else if (r.tipo === "vocal") mal(b, valor, `Con la ${valor} queda ${r.c + valor}. Buscá ${r.silaba}.`);
  else if (r.tipo === "consonante") mal(b, valor, `Con ${letra(valor)} queda ${valor + r.v}. Buscá ${r.silaba}.`);
  else if (r.tipo === "leer") mal(b, valor, `${ese(o)} ${o.t}. ${r.voz ? "Tocá cada sílaba y leé otra vez." : "Leé otra vez, despacito."}`);
  else mal(b, valor, `Ese dibujo es ${o.t}. ${r.voz ? "Tocá cada palabra y leé otra vez." : "Leé otra vez, despacito."}`);
});

function tocarFicha(b, i) {
  const s = r.fichas[i], sig = r.palabra.s[puestas.length];
  if (s === sig) {
    sonido("tap"); hablar(s);
    usadas.add(i); puestas.push(s);
    pintar();
    if (puestas.length === r.palabra.s.length) {
      const k = [...$("escena").querySelectorAll(".huecos .ficha")];
      k.forEach(x => x.classList.add("junta"));
      bien(null);
    }
    return;
  }
  const pos = r.palabra.s.indexOf(s);
  if (pos < 0) { b.disabled = true; usadas.add(i); } // la que sobra ya no se puede volver a tocar
  mal(b, `${i}-${puestas.length}`, pos > puestas.length
    ? `${cap(s)} va después. ¿Qué suena primero? ${r.palabra.t}.`
    : `${cap(s)} no va en ${r.palabra.t}. Escuchá: ${r.palabra.s.join(", ")}.`);
}

// Tocar una sílaba (o palabra) para oírla: si la ronda es «solito», no suena
$("escena").addEventListener("click", e => {
  const b = e.target.closest("[data-p]");
  if (!b || !r) return;
  const k = Number(b.dataset.p), piezas = r.tipo === "leer" ? r.palabra.s : r.palabras;
  b.classList.add("leida"); leidas.add(k);
  b.classList.remove("senal");
  sonido("tap");
  if (r.voz || listo) hablar(piezas[k]);
});

// 💡 en «leé solito»: dice la palabra por sílabas (o la oración), y cuenta como ayuda
$("pistaBtn").addEventListener("click", () => {
  if (!r || listo) return;
  usoPista = true;
  sonido("tap");
  $("pistaBtn").classList.remove("senal");
  decir(r.tipo === "leer" ? `${r.palabra.s.join(", ")}.` : `${r.texto}.`);
});

$("nextBtn").addEventListener("click", () => {
  // Saltarse una ronda después de equivocarse cuenta como ronda difícil
  if (!listo && fallos > 0) esc.resultado({ fallos: 2 });
  sonido("tap"); nuevo();
});
niveles(v => {
  esc.activa = v === "auto";
  manual = v === "auto" ? null : v;
  antes = ""; nuevo();
});
alEmpezar(nuevo, lento => presentar(lento));

if (new URLSearchParams(location.search).has("prueba")) window.__silabas = { get r() { return r; }, get nivel() { return esc.nivel; }, get activa() { return esc.activa; }, get fallos() { return fallos; } };
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
