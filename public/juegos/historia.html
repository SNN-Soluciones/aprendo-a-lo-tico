<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La historia de Costa Rica</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/prepa.css">
<link rel="stylesheet" href="../css/quiz.css">
<style>
  :root { --materia: #F29A1F; }
  /* Los modos en una sola fila que se desliza (como en el sudoku), para que no ocupen media pantalla */
  .top .modos { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px 2px 8px; }
  .top .modos::-webkit-scrollbar { display: none; }
  .top .modos button { flex: none; white-space: nowrap; }
  .modos button.auto { font-size: 1.1rem; }

  /* ⏳ Línea del tiempo: casillas de arriba (más antiguo) a abajo (más reciente) */
  .guia { margin: 10px 0 4px; text-align: center; font-weight: 800; font-size: .95rem; color: var(--page-ink); }
  .slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .slot {
    display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 4px 8px;
    border: 3px dashed var(--rim); border-radius: 16px; background: rgba(255, 255, 255, .45);
  }
  .slot .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--materia); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .slot .quitar {
    flex: 1; display: flex; align-items: center; gap: 8px; text-align: left; padding: 4px 10px; border-radius: 12px;
    font-size: 1rem; line-height: 1.15; border-width: 3px; box-shadow: 0 3px 0 var(--rim);
  }
  .slot .quitar .e { font-size: 1.6rem; }
  .slot .quitar small { margin-left: auto; color: #B86A00; font-size: .95rem; white-space: nowrap; }
  .slot.bien { border-style: solid; border-color: var(--ok); background: #CFF5DC; }
  .slot.bien .quitar { background: #CFF5DC; }
  .cartas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .carta { border-radius: 16px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 1rem; line-height: 1.15; }
  .carta .e { font-size: 1.9rem; line-height: 1.1; }
  .carta small { color: #B86A00; font-size: .95rem; }
  .carta.usada { visibility: hidden; }
  .opciones button { text-align: center; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="start" id="start">
  <div class="big" aria-hidden="true">🌽⛵🇨🇷🕊️</div>
  <h1>La historia de Costa Rica</h1>
  <button id="startBtn" aria-label="Empezar">▶️</button>
  <p>Los pueblos originarios, la Independencia, la Campaña Nacional, la abolición del ejército y más: ordená la línea del tiempo y descubrí por qué importa. Subile el volumen 🔊.</p>
</div>

<div class="wrap top ancho">
  <div class="modos" id="modos" role="group" aria-label="Modo de juego"></div>
  <div class="escalera" id="escalera"></div>
  <div class="stars" id="stars">⭐ 0</div>
</div>

<div class="wrap instr ancho"><button class="oir" id="oir" aria-label="Escuchar otra vez">🔊</button><button class="lento" id="lento" aria-label="Escuchar despacio">🐢</button><div class="txt" id="instr"></div></div>

<div id="juego" class="ancho">
  <div class="tarjeta" id="tarjeta" aria-live="polite"></div>
  <div id="zona"></div>
</div>
<div class="wrap feedback ancho" id="feedback" aria-live="polite"></div>
<div class="explica ancho" id="explica" hidden aria-live="polite"></div>
<button id="sigBtn" class="ancho" hidden>Siguiente ➡️</button>

<script type="module">
import { elogio, sonido, LENTO } from "../js/voz.js";
import { decir, instruccion, feedback, estrellas, alEmpezar, senalar, ayudaSiSeQueda } from "../js/prepa.js";
import { escalera } from "../js/escalera.js";
import { ESCALONES, MODOS, inicioPorEdad, preguntaDeModo, hecho } from "../js/historia.js";

const $ = id => document.getElementById(id);
const sinHtml = t => t.replace(/<[^>]+>/g, "");

// 🪜 De a poquito por defecto; los otros modos son para el papá o la maestra (no mueven la escalera)
const esc = escalera("historia", { escalones: ESCALONES.length, inicio: inicioPorEdad });
const stars = estrellas("historia-stars");
// Si se queda mucho rato sin tocar nada, se le vuelve a leer la pregunta (ya leen: no se le señala la respuesta)
const ayuda = ayudaSiSeQueda({ espera: 25000 });

let modo = "auto", q = null, fallos = 0, listo = false, puestos = [];

function pintarModos() {
  $("modos").innerHTML = `<button class="auto" data-modo="auto" aria-pressed="${modo === "auto"}" aria-label="De a poquito: sube solo">🪜</button>`
    + MODOS.map(m => `<button data-modo="${m.id}" aria-pressed="${m.id === modo}">${m.nombre}</button>`).join("");
  $("modos").querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: "nearest", inline: "center" });
}
/** La pista también se lee en pantalla (ya leen), en el cuadro de abajo. */
function pista(texto) {
  $("explica").hidden = false;
  $("explica").textContent = `💡 ${texto}`;
}
$("modos").addEventListener("click", e => {
  const b = e.target.closest("[data-modo]");
  if (!b) return;
  sonido("tap");
  modo = b.dataset.modo;
  esc.activa = modo === "auto";
  pintarModos(); nueva();
});

// ---------- Pregunta nueva ----------
function nueva() {
  q = modo === "auto" ? ESCALONES[esc.nivel].gen(Math.random) : preguntaDeModo(MODOS.find(m => m.id === modo));
  fallos = 0; listo = false; puestos = [];
  $("tarjeta").innerHTML = q.html;
  $("explica").hidden = true; $("sigBtn").hidden = true;
  feedback("");
  if (q.tipo === "opciones") {
    $("zona").innerHTML = `<div class="opciones" style="grid-template-columns:repeat(${q.cols || 1}, 1fr)">${
      q.opciones.map(o => `<button data-id="${o.id}">${o.html}</button>`).join("")}</div>`;
  } else if (q.tipo === "escribir") {
    $("zona").innerHTML = `<form class="escribir" id="escribir" novalidate>
      <input id="respuesta" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="El año"><button type="submit">✔️</button></form>`;
    setTimeout(() => $("respuesta")?.focus({ preventScroll: true }), 50);
  } else pintarOrden();
  instruccion(q.instr, q.voz);
  ayuda.empezar();
}

// ---------- Fin de la ronda ----------
function ganar() {
  listo = true;
  ayuda.parar();
  const limpio = fallos === 0 && !ayuda.usada;
  if (limpio) { const bien = elogio(); stars.sumar(); feedback("ok", "🎉", bien); decir(`${bien} ${sinHtml(q.explica)}`); }
  else { feedback("almost", "🤏", "¡Ahora sí!"); decir(`¡Ahora sí! ${sinHtml(q.explica)}`); }
  cerrar();
}
/** Después de 2 intentos se muestra la respuesta y se explica. */
function mostrarRespuesta() {
  listo = true;
  ayuda.parar();
  feedback("bad", "📖", "Así era");
  decir(`Así era: ${sinHtml(q.explica)}`);
  cerrar();
}
function cerrar() {
  $("explica").hidden = false; $("explica").innerHTML = q.explica;
  esc.resultado({ fallos, ayuda: ayuda.usada, opciones: q.tipo === "opciones" ? q.opciones.length : 0 });
  $("sigBtn").hidden = false;
}

// ---------- Opciones ----------
$("zona").addEventListener("click", e => {
  if (!q || listo) return;
  const b = e.target.closest(".opciones [data-id]");
  if (b && !b.disabled) return elegir(b);
  const c = e.target.closest("[data-h]");
  if (c) return poner(c.dataset.h);
  const s = e.target.closest("[data-quitar]");
  if (s) return quitar(Number(s.dataset.quitar));
});

function elegir(b) {
  const o = q.opciones.find(x => x.id === b.dataset.id);
  const botones = [...$("zona").querySelectorAll(".opciones button")];
  const buena = botones.find(x => x.dataset.id === q.correcta);
  if (o.id === q.correcta) {
    b.classList.remove("senal"); b.classList.add("right");
    botones.forEach(x => { if (x !== b) x.disabled = true; });
    return ganar();
  }
  fallos++;
  b.classList.add("wrong", "nope"); b.disabled = true;
  const quedan = botones.filter(x => !x.disabled).length;
  feedback("bad", "🤔", "No es");
  if (o.porque) pista(o.porque);
  if (fallos >= 2 || quedan === 1) {
    senalar(buena);
    decir(`${o.porque || "Esa no es."} Mirá la que brilla: esa es la respuesta.`);
  } else decir(`${o.porque || "Esa no es."} Probá otra vez.`);
}

// ---------- ⏳ Línea del tiempo ----------
function pintarOrden(bien = 0) {
  const n = q.items.length, ver = q.conAño || listo; // al terminar se muestran los años
  $("zona").innerHTML = `<p class="guia">⬆️ Más antiguo</p><ol class="slots">${
    Array.from({ length: n }, (_, i) => {
      const h = puestos[i] && hecho(puestos[i]);
      return `<li class="slot${i < bien ? " bien" : ""}"><span class="num">${i + 1}</span>${h
        ? `<button class="quitar" data-quitar="${i}" aria-label="${h.t}: tocá para quitarlo"><span class="e" aria-hidden="true">${h.e}</span>${h.t}${ver ? `<small>${h.cuando}</small>` : ""}</button>`
        : ""}</li>`;
    }).join("")}</ol><p class="guia">⬇️ Más reciente</p>
    <div class="cartas">${q.items.map(h => `<button class="carta${puestos.includes(h.id) ? " usada" : ""}" data-h="${h.id}"><span class="e" aria-hidden="true">${h.e}</span>${h.t}${q.conAño ? `<small>${h.cuando}</small>` : ""}</button>`).join("")}</div>`;
}

function poner(id) {
  if (puestos.includes(id)) return;
  sonido("tap");
  puestos.push(id);
  pintarOrden();
  if (puestos.length === q.items.length) revisarOrden();
}
function quitar(i) {
  sonido("tap");
  puestos.splice(i, 1);
  pintarOrden();
}

function revisarOrden() {
  const k = puestos.findIndex((id, i) => id !== q.orden[i]);
  if (k === -1) { listo = true; pintarOrden(q.orden.length); return ganar(); }
  fallos++;
  const puso = hecho(puestos[k]), iba = hecho(q.orden[k]);
  if (fallos >= 2) {
    listo = true;
    puestos = [...q.orden];
    pintarOrden(q.orden.length);
    return mostrarRespuesta();
  }
  // Los que están bien se quedan; de ahí para abajo se vuelve a intentar
  puestos = puestos.slice(0, k);
  pintarOrden(k);
  const ayudita = q.conAño ? `Fijate en los años: ${iba.cuando} es antes que ${puso.cuando}.` : `${iba.t} fue antes que ${puso.t}.`;
  pista(ayudita);
  if (k > 0) {
    feedback("almost", "🤏", `¡Casi! ${k === 1 ? "El primero está" : `Los primeros ${k} están`} bien`);
    decir(`¡Casi! ${k === 1 ? "El primero está bien" : `Los primeros ${k} están bien`}. ${ayudita} Seguí desde la casilla ${k + 1}.`);
  } else {
    feedback("bad", "🤔", "No es ese orden");
    decir(`Todavía no. ${ayudita} Probá otra vez.`);
  }
}

// ---------- ¿En qué año? ----------
$("zona").addEventListener("submit", e => {
  e.preventDefault();
  if (!q || listo || q.tipo !== "escribir") return;
  const campo = $("respuesta"), v = Number(campo.value.trim());
  if (!campo.value.trim() || !Number.isFinite(v)) return;
  if (v === q.año) { campo.classList.add("right"); campo.disabled = true; return ganar(); }
  fallos++;
  if (fallos >= 2) {
    campo.classList.add("wrong"); campo.disabled = true;
    campo.insertAdjacentHTML("afterend", `<span class="era">✔️ ${q.año}</span>`);
    return mostrarRespuesta();
  }
  campo.value = "";
  const dif = v - q.año;
  if (Math.abs(dif) <= 10) {
    feedback("almost", "🤏", "¡Casi!");
    pista(`Fue un poquito ${dif > 0 ? "antes" : "después"} de ${v}.`);
    decir(`¡Casi! Fue un poquito ${dif > 0 ? "antes" : "después"} de ${v}. Probá otra vez.`);
  } else {
    feedback("bad", "🤔", "No es");
    pista(`Fue en los años ${Math.floor(q.año / 100) * 100}, ${dif > 0 ? "antes" : "después"} de ${v}.`);
    decir(`No es ${v}. Una pista: fue en los años ${Math.floor(q.año / 100) * 100}, ${dif > 0 ? "antes" : "después"} de ${v}. Probá otra vez.`);
  }
  campo.focus({ preventScroll: true });
});

$("sigBtn").addEventListener("click", () => { sonido("tap"); nueva(); });

const repetir = lento => q && decir(q.voz, lento ? { rate: LENTO } : undefined);
alEmpezar(nueva, repetir);
pintarModos();

if (new URLSearchParams(location.search).has("prueba")) window.__historia = { get q() { return q; }, get nivel() { return esc.nivel; }, get modo() { return modo; }, get puestos() { return puestos; } };
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
