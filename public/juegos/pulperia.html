<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La pulpería</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #CFEFE3; --face: #FFFFFF; --rim: #1F3A5F; --ink: #1F3A5F; --soft: #9DB3C9;
    --btn: #FFC83D; --ok: #2FA85A; --warn: #F29A1F; --bad: #D9443A; --page-ink: #1F3A5F;
    --wood: #E9C79A; --wood-d: #B98A52;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16303A; --face: #F7FBFF; --rim: #0E1E2E; --page-ink: #E6F3FF; }
  }
  :root[data-theme="dark"] { --bg: #16303A; --face: #F7FBFF; --rim: #0E1E2E; --page-ink: #E6F3FF; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg);
    font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink); display: flex; flex-direction: column; align-items: center;
    padding: 12px 10px 32px; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { width: min(96vw, 720px); }
  button {
    font: inherit; font-weight: 800; color: var(--ink);
    border: 4px solid var(--rim); border-radius: 999px; background: var(--face);
    padding: 6px 16px; cursor: pointer; box-shadow: 0 4px 0 var(--rim); transition: transform .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rim); }
  button:focus-visible { outline: 3px dashed #2F7FD1; outline-offset: 3px; }
  button:disabled { opacity: .4; cursor: default; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { font-size: .95rem; padding: 3px 12px; }
  .seg button[aria-pressed="true"] { background: var(--btn); }
  .stars { font-size: 1.3rem; font-weight: 800; color: var(--page-ink); }
  .stars.bump, .pop { animation: pop .4s ease-out; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  .row2 { margin-top: 8px; }

  .card { background: var(--face); border: 4px solid var(--rim); border-radius: 22px; padding: 10px 14px; margin-top: 10px; }

  /* Pedido */
  .order-title { margin: 0 0 4px; font-size: 1.25rem; font-weight: 800; text-align: center; }
  .items { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; background: #FFF6E5; border: 3px solid var(--wood-d); border-radius: 16px; padding: 4px 10px; min-width: 88px; }
  .item .emo { font-size: 2.4rem; line-height: 1.1; }
  .item .name { font-weight: 700; font-size: .95rem; }
  .item .price { font-weight: 800; font-size: 1.15rem; }
  .sumline { text-align: center; font-size: 1.35rem; font-weight: 800; margin-top: 6px; }
  .sumline .big { font-size: 1.7rem; }
  .paid { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 1.2rem; font-weight: 800; }

  /* Caja (donde se pone la plata) */
  .tray-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tray-head b { font-size: 1.2rem; }
  .total { font-size: 1.6rem; font-weight: 800; }
  .total.hidden { color: var(--soft); }
  .tray {
    min-height: 120px; margin-top: 6px; border-radius: 16px; padding: 10px;
    background: repeating-linear-gradient(90deg, var(--wood) 0 38px, #E3BD8C 38px 40px);
    border: 3px solid var(--wood-d);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; align-content: flex-start;
  }
  .tray:empty::before { content: "Poné la plata aquí"; color: #8A6232; font-weight: 700; margin: auto; text-align: center; }
  .feedback { min-height: 2.6rem; text-align: center; font-size: 1.4rem; font-weight: 800; margin-top: 6px; line-height: 1.15; }
  .feedback.ok { color: var(--ok); } .feedback.warn { color: var(--warn); } .feedback.bad { color: var(--bad); }
  .feedback small { display: block; font-size: 1rem; color: var(--ink); opacity: .8; font-weight: 700; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .actions .go { background: var(--ok); color: #fff; font-size: 1.3rem; padding: 6px 30px; }
  .actions .next { background: var(--btn); font-size: 1.2rem; }
  .actions .next.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  /* Billetera */
  .wallet-title { margin: 0 0 6px; text-align: center; font-weight: 800; font-size: 1.1rem; }
  .bills, .coins { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .coins { margin-top: 10px; align-items: center; }

  .money { padding: 0; border: none; box-shadow: none; background: none; border-radius: 0; }
  .money:active { transform: scale(.92); box-shadow: none; }

  .bill {
    width: 112px; height: 58px; border-radius: 8px; position: relative; overflow: hidden;
    background: var(--bc); border: 3px solid var(--bd); color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
    box-shadow: 0 3px 0 var(--bd);
  }
  .bill::before {
    content: ""; position: absolute; inset: 4px; border: 2px dashed rgba(255,255,255,.55); border-radius: 5px; pointer-events: none;
  }
  .bill::after {
    content: ""; position: absolute; right: -14px; top: -14px; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.18); pointer-events: none;
  }
  .bill .amt { font-size: 1.15rem; font-weight: 800; text-shadow: 0 1px 0 rgba(0,0,0,.35); position: relative; z-index: 1; line-height: 1; }
  .bill .ani { font-size: 1.7rem; position: relative; z-index: 1; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
  .bill .cr { position: absolute; left: 8px; bottom: 5px; font-size: .55rem; font-weight: 700; opacity: .9; letter-spacing: .02em; }

  .coin {
    width: var(--sz); height: var(--sz); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFF3B0 0 12%, #F2C94C 40%, #C9971C 100%);
    border: 3px solid #9C7412; color: #6B4E06;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: calc(var(--sz) * .3); line-height: 1;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 0 3px 0 #9C7412;
  }

  .tray .bill { width: 84px; height: 44px; }
  .tray .bill .amt { font-size: .9rem; }
  .tray .bill .ani { font-size: 1.2rem; }
  .tray .bill .cr { display: none; }
  .tray .coin { width: calc(var(--sz) * .8); height: calc(var(--sz) * .8); font-size: calc(var(--sz) * .25); }
  .tray .money { animation: drop .25s ease-out; }
  @keyframes drop { from { transform: translateY(-24px) scale(.6); opacity: 0; } }

  .hide { display: none !important; }
  .mywallet { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; min-height: 70px;
    background: #F3EBDD; border: 3px dashed var(--wood-d); border-radius: 16px; padding: 10px; }
  .mywallet:empty::before { content: "La billetera está vacía"; color: #8A6232; font-weight: 700; }
  .locked .money { cursor: default; }
  .quiz .q-step { text-align: center; font-size: .95rem; font-weight: 700; color: var(--soft); margin: 0; }
  .quiz .q-text { text-align: center; font-size: 1.4rem; font-weight: 800; margin: 0 0 6px; line-height: 1.15; }
  .answer { text-align: center; font-size: 2.3rem; font-weight: 800; line-height: 1.1; margin: 4px auto 8px;
    border: 4px solid #2F7FD1; background: #EEF5FF; border-radius: 16px; padding: 2px 16px; min-width: 60%; width: max-content; }
  .answer .ph { color: var(--soft); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; margin: 0 auto; }
  .pad button { font-size: 1.6rem; padding: 4px 0; border-radius: 16px; }
  .pad .del { background: #EEF2F6; }
  .pad .ok { background: var(--ok); color: #fff; }
  .yesno { display: flex; gap: 14px; justify-content: center; }
  .yesno button { font-size: 1.5rem; padding: 6px 30px; }
  .yesno .yes { background: #D8F3E0; } .yesno .no { background: #FBE0DD; }
  .quiz .actions .go { font-size: 1.25rem; }
  .summary { text-align: center; font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
  .summary b { font-size: 1.35rem; }

  @media (prefers-reduced-motion: reduce) {
    .tray .money, .pop, .stars.bump, .actions .next.pulse { animation: none; }
  }

  .home-link {
    position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 50; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    font-size: 1.6rem; background: #FFFFFF; border: 4px solid #1F3A5F; box-shadow: 0 4px 0 #1F3A5F;
  }
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
  .home-link:active { transform: translateY(3px); box-shadow: 0 1px 0 #1F3A5F; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="wrap top">
  <div class="seg" id="modes" role="group" aria-label="Juego">
    <button data-mode="wallet" aria-pressed="true">👛 Mi billetera</button>
    <button data-mode="pay" aria-pressed="false">🛒 Pagar</button>
    <button data-mode="change">🪙 Dar vuelto</button>
  </div>
  <div class="stars" id="stars">⭐ 0</div>
</div>
<div class="wrap top row2">
  <div class="seg" id="levels" role="group" aria-label="Nivel">
    <button data-lvl="1" aria-pressed="true">Fácil</button>
    <button data-lvl="2">Medio</button>
    <button data-lvl="3">Difícil</button>
  </div>
  <div class="seg" id="eyeWrap">
    <button id="eyeBtn" aria-pressed="true">👀 Ver total</button>
  </div>
</div>

<div class="wrap card" id="order"></div>

<div class="wrap card" id="walletCard">
  <p class="wallet-title">👛 Tu billetera · tocá la plata para ponerla en el mostrador</p>
  <div class="mywallet" id="mywallet"></div>
</div>

<div class="wrap card" id="trayCard">
  <div class="tray-head">
    <b id="trayTitle">Tu plata</b>
    <span class="total" id="total"></span>
  </div>
  <div class="tray" id="tray" aria-label="Plata puesta"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="actions" id="trayActions">
    <button id="clearBtn">🧹 Quitar todo</button>
    <button class="go" id="goBtn">✔ Listo</button>
    <button class="next" id="nextBtn">Otro cliente</button>
  </div>
</div>

<div class="wrap card quiz" id="quiz" aria-live="polite"></div>

<div class="wrap card" id="bank">
  <p class="wallet-title">Toca para poner · toca en la caja para quitar</p>
  <div class="bills" id="bills"></div>
  <div class="coins" id="coins"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Colores y animales de la serie actual del BCCR (dibujo simplificado)
  const BILLS = [
    { v: 20000, bc: "#F08A24", bd: "#A8570A", ani: "🐦" },
    { v: 10000, bc: "#3E9E55", bd: "#236A34", ani: "🦥" },
    { v: 5000,  bc: "#E8B820", bd: "#A07C06", ani: "🐒" },
    { v: 2000,  bc: "#2F7FD1", bd: "#1C5796", ani: "🦈" },
    { v: 1000,  bc: "#D9443A", bd: "#962A22", ani: "🦌" },
  ];
  const COINS = [
    { v: 500, sz: 66 }, { v: 100, sz: 58 }, { v: 50, sz: 52 },
    { v: 25, sz: 46 }, { v: 10, sz: 42 }, { v: 5, sz: 36 },
  ];

  // Productos de pulpería
  const ITEMS = [
    ["🍬", "Confites", 100], ["🍌", "Banano", 150], ["🍭", "Chupeta", 200], ["🍪", "Galletas", 500],
    ["🍦", "Helado", 600], ["🧃", "Jugo", 750], ["🥛", "Leche", 950], ["🍫", "Chocolate", 475],
    ["🥤", "Refresco", 1150], ["🍞", "Pan", 1275], ["🫘", "Frijoles", 1235], ["🍚", "Arroz", 1890],
    ["🥚", "Huevos", 2345], ["☕", "Café", 2610], ["🍉", "Sandía", 2825], ["🧀", "Queso", 3480],
    ["🍗", "Pollo", 4650], ["🥑", "Aguacates", 1320], ["🍅", "Tomates", 865], ["🌽", "Elotes", 1500],
  ];

  let mode = "wallet", lvl = 1, showTotal = true;
  // Modo billetera
  let wallet = [];          // plata disponible
  let step = 1;             // 1 elegir, 2 cuánto pusiste, 3 ¿alcanza?, 4 ¿cuánto sobra?, 5 ganó
  let typed = "";
  let order = [], orderTotal = 0, paidWith = 0, target = 0;
  let tray = [];            // valores puestos
  let solved = false;
  let stars = 0;
  try { stars = Number(localStorage.getItem("pulperia-stars")) || 0; } catch (_) {}

  const fmt = v => "₡" + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const rand = a => a[Math.floor(Math.random() * a.length)];

  // ---------- Dibujo de plata ----------
  function billHTML(b, idx) {
    return `<button class="money bill" style="--bc:${b.bc};--bd:${b.bd}" data-v="${b.v}"${idx != null ? ` data-i="${idx}"` : ""} aria-label="${fmt(b.v)}">
      <span class="amt">${String(b.v).replace(/\B(?=(\d{3})+(?!\d))/g, " ")}</span><span class="ani">${b.ani}</span><span class="cr">COSTA RICA</span></button>`;
  }
  function coinHTML(c, idx) {
    return `<button class="money coin" style="--sz:${c.sz}px" data-v="${c.v}"${idx != null ? ` data-i="${idx}"` : ""} aria-label="${fmt(c.v)}">${c.v}</button>`;
  }
  function moneyHTML(v, idx) {
    const b = BILLS.find(x => x.v === v);
    return b ? billHTML(b, idx) : coinHTML(COINS.find(x => x.v === v), idx);
  }

  $("bills").innerHTML = BILLS.slice().reverse().map(b => billHTML(b)).join("");
  $("coins").innerHTML = COINS.map(c => coinHTML(c)).join("");

  // ---------- Problemas ----------
  function pool() {
    if (lvl === 1) return ITEMS.filter(i => i[2] <= 1000 && i[2] % 50 === 0);
    if (lvl === 2) return ITEMS.filter(i => i[2] % 25 === 0);
    return ITEMS;
  }

  function newRound() {
    const p = pool();
    const k = mode === "wallet"
      ? (lvl === 1 ? 1 + Math.floor(Math.random() * 2) : lvl === 2 ? 2 + Math.floor(Math.random() * 2) : 3 + Math.floor(Math.random() * 2))
      : lvl === 1 ? 1 : lvl === 2 ? (Math.random() < .5 ? 1 : 2) : 2 + Math.floor(Math.random() * 2);
    const picked = [];
    while (picked.length < k) {
      const it = rand(p);
      if (!picked.includes(it)) picked.push(it);
    }
    order = picked;
    orderTotal = order.reduce((s, i) => s + i[2], 0);

    if (mode === "wallet") {
      wallet = makeWallet(orderTotal);
      step = 1; typed = "";
    }

    if (mode === "pay") {
      target = orderTotal;
    } else {
      const bigger = BILLS.map(b => b.v).filter(v => v > orderTotal).sort((a, b) => a - b);
      // casi siempre el billete que sigue; a veces uno más grande para que cueste más
      paidWith = lvl >= 2 && bigger.length > 1 && Math.random() < .35 ? bigger[1] : bigger[0];
      target = paidWith - orderTotal;
    }
    tray = []; solved = false;
    $("nextBtn").classList.remove("pulse");
    setFeedback("", "");
    render();
  }

  // Arma una billetera al azar que sí alcanza, con billetes y monedas revueltos
  function makeWallet(cost) {
    const DEN = [20000, 10000, 5000, 2000, 1000, 500, 100, 50, 25, 10, 5];
    const minCoin = lvl === 1 ? 50 : lvl === 2 ? 25 : 5;
    const extra = Math.max(500, Math.round(cost * (0.3 + Math.random() * 0.9) / 5) * 5);
    let left = Math.ceil((cost + extra) / minCoin) * minCoin;
    const out = [];
    while (left > 0 && out.length < 14) {
      const opts = DEN.filter(d => d <= left && d >= minCoin);
      // a veces agarra un billete más chiquito para que haya variedad
      const pick = opts[Math.min(opts.length - 1, Math.random() < .55 ? 0 : Math.random() < .7 ? 1 : 2)];
      out.push(pick); left -= pick;
    }
    if (left > 0) out.push(...DEN.filter(d => d >= minCoin).reduce((acc, d) => { while (left >= d) { acc.push(d); left -= d; } return acc; }, []));
    return out.sort((a, b) => b - a);
  }

  const traySum = () => tray.reduce((s, v) => s + v, 0);

  function renderQuiz() {
    const q = $("quiz");
    const sum = traySum();
    const stepLbl = n => `<p class="q-step">Paso ${n} de 4</p>`;
    const pad = `<div class="answer">${typed ? fmt(Number(typed)) : '<span class="ph">₡ ___</span>'}</div>
      <div class="pad" id="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join("")}
        <button class="del" data-del="1" aria-label="Borrar">⌫</button><button data-n="0">0</button>
        <button class="ok" data-ok="1" aria-label="Revisar" ${typed ? "" : "disabled"}>✔</button>
      </div>`;
    const back = `<div class="actions"><button data-back="1">↩ Cambiar la plata</button></div>`;
    let html = "";
    if (step === 1) {
      html = `${stepLbl(1)}<p class="q-text">¿Con qué pagarías? Poné billetes y monedas en el mostrador</p>
        <div class="actions"><button class="go" data-chosen="1" ${tray.length ? "" : "disabled"}>✔ Ya elegí</button></div>`;
    } else if (step === 2) {
      html = `${stepLbl(2)}<p class="q-text">¿Cuánta plata pusiste en el mostrador?</p>${pad}${back}`;
    } else if (step === 3) {
      html = `${stepLbl(3)}<p class="q-text">Las cosas cuestan ${fmt(orderTotal)} y pusiste ${fmt(sum)}.<br>¿Te alcanza?</p>
        <div class="yesno"><button class="yes" data-yes="1">👍 Sí</button><button class="no" data-no="1">👎 No</button></div>${back}`;
    } else if (step === 4) {
      html = `${stepLbl(4)}<p class="q-text">¿Cuánto te sobra? (el vuelto)</p>${pad}${back}`;
    } else {
      const change = sum - orderTotal;
      const extraPiece = tray.find(v => sum - v >= orderTotal);
      html = `<div class="summary">Pusiste <b>${fmt(sum)}</b><br>Costaba <b>${fmt(orderTotal)}</b><br>
        ${change === 0 ? "¡Pagaste exacto, no sobra nada! 🎯" : `Te sobran <b>${fmt(change)}</b>`}
        ${extraPiece ? `<br><small>💡 Pista: podías pagar sin ${BILLS.some(b => b.v === extraPiece) ? "el billete" : "la moneda"} de ${fmt(extraPiece)}</small>` : ""}</div>
        <div class="actions"><button class="next pulse" data-next="1">Otra compra</button></div>`;
    }
    q.innerHTML = html;
  }

  function winStar() {
    stars++;
    try { localStorage.setItem("pulperia-stars", stars); } catch (_) {}
    const s = $("stars");
    s.textContent = "⭐ " + stars;
    s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
  }

  function checkTyped(expected, okMsg, hint) {
    const v = Number(typed);
    if (v === expected) { setFeedback("ok", okMsg); return true; }
    const diff = Math.abs(v - expected);
    if (diff <= 50) setFeedback("warn", "¡Casi! 🤏", hint);
    else setFeedback("bad", "Uy, no es 🙈", hint);
    typed = "";
    return false;
  }

  $("quiz").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const sum = traySum();
    if (b.dataset.n) {
      if (typed.length < 6 && !(typed === "" && b.dataset.n === "0")) typed += b.dataset.n;
      setFeedback("", "");
    } else if (b.dataset.del) {
      typed = typed.slice(0, -1);
    } else if (b.dataset.back) {
      step = 1; typed = ""; setFeedback("", "");
    } else if (b.dataset.chosen) {
      step = 2; typed = ""; setFeedback("", "");
    } else if (b.dataset.ok && step === 2) {
      if (checkTyped(sum, "¡Bien contado! 👏", "Contá otra vez: primero los billetes, después las monedas")) { step = 3; typed = ""; }
    } else if (b.dataset.yes || b.dataset.no) {
      const alcanza = sum >= orderTotal;
      const said = !!b.dataset.yes;
      if (said !== alcanza) {
        setFeedback("bad", "Mmm, pensalo otra vez 🤔", `¿${fmt(sum)} es más o menos que ${fmt(orderTotal)}?`);
      } else if (!alcanza) {
        setFeedback("warn", "¡Correcto, no alcanza! 👍", "Agregá más plata de tu billetera");
        step = 1;
      } else if (sum === orderTotal) {
        setFeedback("ok", "¡Sí alcanza, y exacto! 🎉"); step = 5; winStar();
      } else {
        setFeedback("ok", "¡Sí alcanza! 👍"); step = 4; typed = "";
      }
    } else if (b.dataset.ok && step === 4) {
      if (checkTyped(sum - orderTotal, "¡Pura vida, exacto! 🎉", "Hacé la resta: lo que pusiste − lo que cuesta")) { step = 5; winStar(); }
    } else if (b.dataset.next) {
      newRound(); return;
    }
    render();
  });

  $("mywallet").addEventListener("click", e => {
    const m = e.target.closest(".money");
    if (!m || step !== 1) return;
    const i = Number(m.dataset.i);
    tray.push(wallet[i]); wallet.splice(i, 1);
    tray.sort((a, b) => b - a);
    setFeedback("", "");
    render();
  });

  // ---------- Render ----------
  function render() {
    const W = mode === "wallet";
    $("walletCard").classList.toggle("hide", !W);
    $("quiz").classList.toggle("hide", !W);
    $("bank").classList.toggle("hide", W);
    $("trayActions").classList.toggle("hide", W);
    $("eyeWrap").classList.toggle("hide", W);
    $("trayCard").classList.toggle("locked", W && step !== 1);
    let html = `<p class="order-title">${W ? "Vas a la pulpería y comprás:" : mode === "pay" ? "¿Cuánto tenés que pagar?" : "Un cliente compra:"}</p>`;
    html += `<div class="items">${order.map(i => `<div class="item"><span class="emo">${i[0]}</span><span class="name">${i[1]}</span><span class="price">${fmt(i[2])}</span></div>`).join("")}</div>`;
    if (W) {
      html += `<div class="sumline">Todo cuesta: <span class="big">${fmt(orderTotal)}</span></div>`;
    } else if (order.length > 1) {
      html += `<div class="sumline">Total: <span class="big">${lvl === 3 && mode === "pay" && !solved ? "¿?" : fmt(orderTotal)}</span></div>`;
    }
    if (mode === "change") {
      const b = BILLS.find(x => x.v === paidWith);
      html += `<div class="paid">Te paga con ${billHTML(b)} <span>¿Cuánto vuelto le das?</span></div>`;
    }
    $("order").innerHTML = html;

    $("trayTitle").textContent = W ? "🧾 En el mostrador" : mode === "pay" ? "Lo que pagás" : "El vuelto";
    const sum = tray.reduce((s, v) => s + v, 0);
    const t = $("total");
    const seeTotal = W ? step >= 3 : showTotal;
    t.textContent = seeTotal ? fmt(sum) : "₡ ?";
    t.classList.toggle("hidden", !seeTotal);
    if (W) {
      $("mywallet").innerHTML = wallet.map((v, i) => moneyHTML(v, i)).join("");
      renderQuiz();
    }

    $("tray").innerHTML = tray.map((v, i) => moneyHTML(v, i)).join("");
    $("goBtn").disabled = tray.length === 0 || solved;
    $("clearBtn").disabled = tray.length === 0 || solved;
  }

  function setFeedback(cls, main, sub) {
    const f = $("feedback");
    f.className = "feedback " + cls;
    f.innerHTML = main ? `${main}${sub ? `<small>${sub}</small>` : ""}` : "";
    if (main) { f.classList.remove("pop"); void f.offsetWidth; f.classList.add("pop"); }
  }

  // ---------- Acciones ----------
  $("bills").addEventListener("click", addFrom);
  $("coins").addEventListener("click", addFrom);
  function addFrom(e) {
    const m = e.target.closest(".money");
    if (!m || solved) return;
    tray.push(Number(m.dataset.v));
    tray.sort((a, b) => b - a);
    setFeedback("", "");
    render();
  }

  $("tray").addEventListener("click", e => {
    const m = e.target.closest(".money");
    if (!m || solved) return;
    if (mode === "wallet") {
      if (step !== 1) return;
      wallet.push(tray[Number(m.dataset.i)]);
      wallet.sort((a, b) => b - a);
    }
    tray.splice(Number(m.dataset.i), 1);
    setFeedback("", "");
    render();
  });

  $("clearBtn").addEventListener("click", () => { tray = []; setFeedback("", ""); render(); });

  $("goBtn").addEventListener("click", () => {
    const sum = tray.reduce((s, v) => s + v, 0);
    if (sum === target) {
      solved = true;
      stars++;
      try { localStorage.setItem("pulperia-stars", stars); } catch (_) {}
      const s = $("stars");
      s.textContent = "⭐ " + stars;
      s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
      const extra = mode === "pay"
        ? `Pagaste ${fmt(target)} exactos`
        : `${fmt(paidWith)} − ${fmt(orderTotal)} = ${fmt(target)}`;
      setFeedback("ok", "¡Pura vida, exacto! 🎉", extra + (tray.length <= fewest(target) ? " · ¡con la menor cantidad de piezas! 🏆" : ""));
      $("nextBtn").classList.add("pulse");
      render();
    } else if (sum < target) {
      setFeedback("warn", "Te falta plata 🤏", mode === "pay" ? "Poné un poquito más" : "El vuelto está incompleto");
    } else {
      setFeedback("bad", "¡Te pasaste! 🙈", mode === "pay" ? "Estás dando de más, quitá algo" : "Le estás dando mucho vuelto");
    }
  });

  // mínima cantidad de piezas (greedy funciona con estas denominaciones)
  function fewest(v) {
    let n = 0;
    for (const d of [20000, 10000, 5000, 2000, 1000, 500, 100, 50, 25, 10, 5]) { n += Math.floor(v / d); v %= d; }
    return n;
  }

  $("nextBtn").addEventListener("click", newRound);

  $("eyeBtn").addEventListener("click", () => {
    showTotal = !showTotal;
    $("eyeBtn").setAttribute("aria-pressed", showTotal);
    $("eyeBtn").textContent = showTotal ? "👀 Ver total" : "🙈 Sin total";
    render();
  });

  function bindSeg(id, attr, fn) {
    $(id).addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      fn(b.dataset[attr]);
      newRound();
    });
  }
  bindSeg("modes", "mode", v => mode = v);
  bindSeg("levels", "lvl", v => lvl = Number(v));

  $("stars").textContent = "⭐ " + stars;
  newRound();
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
