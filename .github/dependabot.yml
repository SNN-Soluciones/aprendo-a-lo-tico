# 🔄 Avisos semanales de dependencias con parches (de seguridad sobre todo), como PR que pasan por la CI.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
