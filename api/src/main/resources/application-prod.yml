# Producción (App Platform). Los secretos van solo por variables de entorno y SIN valor por defecto:
# si falta uno, la aplicación no arranca (DISENO.md, B14).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
    hikari:
      data-source-properties:
        # La conexión a la base siempre cifrada (si DB_URL pide verify-full, eso manda)
        sslmode: require
  flyway:
    # Las migraciones corren con el rol dueño de las tablas; la aplicación, con uno que solo lee y agrega
    # (DISENO.md, sección 7). Mientras no exista ese segundo rol, se pueden poner las mismas credenciales.
    user: ${DB_MIGRACION_USUARIO}
    password: ${DB_MIGRACION_CLAVE}

server:
  # App Platform termina el HTTPS adelante: se confía en sus cabeceras X-Forwarded-* para el esquema y el host
  forward-headers-strategy: framework

app:
  sitio-url: ${SITIO_URL}

logging:
  structured:
    format:
      console: ecs
