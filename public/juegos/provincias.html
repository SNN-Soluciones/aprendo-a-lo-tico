<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de provincias</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #CFEFE3;
    --face: #FFFFFF;
    --rim: #1F3A5F;
    --ink: #1F3A5F;
    --soft: #9DB3C9;
    --btn: #FFC83D;
    --ok: #2FA85A;
    --almost: #D98A00;
    --bad: #D9443A;
    --page-ink: #1F3A5F;
    --materia: #F29A1F;
    --sea: #BFE3F5;
    --land: #FFF3D6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16303A; --face: #F7FBFF; --rim: #0E1E2E; --page-ink: #E6F3FF; }
  }
  :root[data-theme="dark"] { --bg: #16303A; --face: #F7FBFF; --rim: #0E1E2E; --page-ink: #E6F3FF; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg);
    font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 10px 32px;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { width: min(96vw, 720px); }

  button {
    font: inherit; font-weight: 800; color: var(--ink);
    border: 4px solid var(--rim); border-radius: 999px;
    background: var(--face); padding: 6px 16px; cursor: pointer;
    box-shadow: 0 4px 0 var(--rim); transition: transform .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rim); }
  button:focus-visible { outline: 3px dashed var(--materia); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; transform: none; box-shadow: 0 4px 0 var(--rim); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .levels button { font-size: 1rem; padding: 4px 12px; }
  .levels button[aria-pressed="true"] { background: var(--btn); }
  .stars { font-size: 1.3rem; font-weight: 800; color: var(--page-ink); white-space: nowrap; }

  .prompt {
    margin-top: 12px; background: var(--face); border: 4px solid var(--rim); border-radius: 22px;
    padding: 6px 112px 6px 14px; text-align: center; font-size: clamp(1.25rem, 5.5vw, 1.8rem); font-weight: 800; line-height: 1.2;
    position: relative; min-height: 3.4rem; display: flex; align-items: center; justify-content: center;
  }
  .prompt b { color: var(--materia); }
  .speak { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); font-size: 1.3rem; padding: 0 10px; border-width: 3px; box-shadow: 0 3px 0 var(--rim); }
  .speak:active { transform: translateY(calc(-50% + 3px)); }
  .speak.lento { right: 66px; font-size: 1.1rem; }

  .map { margin-top: 10px; background: var(--sea); border: 4px solid var(--rim); border-radius: 22px; overflow: hidden; }
  .map svg { display: block; width: 100%; height: auto; }
  .prov { fill: var(--land); stroke: var(--rim); stroke-width: 2.5; stroke-linejoin: round; cursor: pointer; transition: fill .15s; }
  .prov:hover { fill: #FFE3A3; }
  .prov.sel { fill: var(--btn); }
  .prov.ok { fill: #8FDBA8; }
  .prov.bad { fill: #F4A69E; }
  .prov.flash { animation: flash .5s; }
  @keyframes flash { 50% { fill: #F4A69E; } }
  .prov:focus { outline: none; }
  .prov:focus-visible { stroke: var(--materia); stroke-width: 6; }
  .etq { font: 800 40px "Baloo 2", system-ui, sans-serif; fill: var(--rim); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #FFFFFF; stroke-width: 8px; stroke-linejoin: round; }
  .ciudad { display: none; }
  .ciudad.show { display: inline; }
  .ciudad circle { fill: #D9443A; stroke: #FFFFFF; stroke-width: 4; }
  .ciudad text { font: 800 34px "Baloo 2", system-ui, sans-serif; fill: var(--rim); paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; pointer-events: none; }
  .mar { font: italic 700 34px "Baloo 2", system-ui, sans-serif; fill: #5A8FB0; text-anchor: middle; pointer-events: none; }
  .coco-box { fill: none; stroke: #5A8FB0; stroke-width: 2; stroke-dasharray: 6 5; }
  .coco-lab { font: 700 22px "Baloo 2", system-ui, sans-serif; fill: #3F6F8F; text-anchor: middle; pointer-events: none; }
  .hide-labels .etq { display: none; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  .options:empty { display: none; }
  .options button { border-radius: 20px; font-size: clamp(1.05rem, 4.5vw, 1.3rem); padding: 8px 6px; }
  .options button.right { background: #C9F2D6; border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); opacity: 1; }
  .options button.wrong { background: #FBD5D1; }

  .feedback {
    min-height: 4.6rem; margin-top: 10px; text-align: center; font-size: 1.5rem; font-weight: 800;
    color: var(--page-ink); line-height: 1.15; display: flex; align-items: center; justify-content: center;
  }
  .feedback.ok { color: var(--ok); }
  .feedback.almost { color: var(--almost); }
  .feedback.bad { color: var(--bad); }
  .feedback.info { font-size: 1.35rem; }
  .feedback small { display: block; font-size: 1.05rem; font-weight: 700; color: var(--page-ink); opacity: .9; margin-top: 2px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .feedback.ok { color: #7BE3A0; }
    :root:not([data-theme="light"]) .feedback.almost { color: #FFC83D; }
    :root:not([data-theme="light"]) .feedback.bad { color: #FF8A80; }
  }

  .bottom { display: flex; justify-content: center; margin-top: 6px; }
  .bottom button { background: var(--btn); font-size: 1.3rem; padding: 8px 28px; }
  .bottom button.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) {
    .prov.flash, .bottom button.pulse { animation-duration: .01s; animation-iteration-count: 1; }
  }
  .credito { margin-top: 14px; font-size: .8rem; color: var(--page-ink); opacity: .75; text-align: center; }
  .credito a { color: inherit; }

  .home-link {
    position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 50; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    font-size: 1.6rem; background: #FFFFFF; border: 4px solid #1F3A5F; box-shadow: 0 4px 0 #1F3A5F;
  }
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
  .home-link:active { transform: translateY(3px); box-shadow: 0 1px 0 #1F3A5F; }
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // 🗺️ Provincias: etiqueta (x, y), cabecera y su punto (cx, cy) en el mapa.
  const PROV = {
    guanacaste: { n: "Guanacaste", cab: "Liberia", x: 185, y: 250, cx: 157, cy: 180,
      dato: "Se unió a Costa Rica el 25 de julio de 1824. ¡Tierra de sabaneros y playas!" },
    alajuela: { n: "Alajuela", cab: "Alajuela", x: 420, y: 225, cx: 510, cy: 362,
      dato: "Tierra de Juan Santamaría. Ahí está el aeropuerto que lleva su nombre." },
    heredia: { n: "Heredia", cab: "Heredia", x: 565, y: 215, cx: 538, cy: 367,
      dato: "Le dicen «la ciudad de las flores». Es la provincia más pequeña." },
    sanjose: { n: "San José", cab: "San José", x: 590, y: 500, cx: 549, cy: 386,
      dato: "Su cabecera es la capital de Costa Rica." },
    cartago: { n: "Cartago", cab: "Cartago", x: 690, y: 450, cx: 596, cy: 406,
      dato: "Fue la primera capital. Ahí está la Basílica de Nuestra Señora de los Ángeles." },
    limon: { n: "Limón", cab: "Limón", x: 790, y: 330, cx: 851, cy: 369,
      dato: "Está en el Caribe. Ahí queda el Parque Nacional Tortuguero." },
    puntarenas: { n: "Puntarenas", cab: "Puntarenas", x: 740, y: 700, cx: 330, cy: 374,
      dato: "Es la provincia más grande. ¡Hasta la Isla del Coco es de Puntarenas!" },
  };
  // Provincias que comparten frontera (para el «¡Casi!»)
  const VECINAS = {
    guanacaste: ["alajuela", "puntarenas"],
    alajuela: ["guanacaste", "heredia", "sanjose", "puntarenas"],
    heredia: ["alajuela", "sanjose", "limon"],
    sanjose: ["alajuela", "heredia", "cartago", "limon", "puntarenas"],
    cartago: ["sanjose", "limon"],
    limon: ["heredia", "sanjose", "cartago", "puntarenas"],
    puntarenas: ["guanacaste", "alajuela", "sanjose", "limon"],
  };
  const IDS = Object.keys(PROV);

  let modo = "explorar", mazo = [], meta = null, fallos = 0, listo = false, ultimo = "";
  let stars = 0;
  try { stars = Number(localStorage.getItem("provincias-stars")) || 0; } catch (_) {}

  // ---------- Voz ----------
  const puedeHablar = "speechSynthesis" in window;
  function hablar(texto, lento = false) {
    if (!puedeHablar) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      const voces = speechSynthesis.getVoices();
      const voz = voces.find(v => /^es[-_](CR|MX|US|419)/i.test(v.lang)) || voces.find(v => /^es/i.test(v.lang));
      if (voz) u.voice = voz;
      u.lang = voz ? voz.lang : "es-MX";
      u.rate = lento ? 0.5 : 1; // normal y 🐢, igual que VELOCIDAD y LENTO en js/voz.js
      speechSynthesis.speak(u);
    } catch (_) {}
  }
  if (puedeHablar) $("speak").hidden = $("lento").hidden = false;

  // ---------- Etiquetas ----------
  const svgNS = "http://www.w3.org/2000/svg";
  const labels = $("labels");
  IDS.forEach(id => {
    const p = PROV[id];
    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("class", "etq"); t.setAttribute("x", p.x); t.setAttribute("y", p.y);
    t.textContent = p.n;
    labels.appendChild(t);
  });
  IDS.forEach(id => {
    const p = PROV[id];
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "ciudad");
    g.dataset.id = id;
    const izq = id === "limon";
    g.innerHTML = `<circle cx="${p.cx}" cy="${p.cy}" r="9"/><text x="${p.cx + (izq ? -14 : 14)}" y="${p.cy + 11}" text-anchor="${izq ? "end" : "start"}">${p.cab}</text>`;
    labels.appendChild(g);
  });

  const provEls = Array.from(document.querySelectorAll(".prov"));
  provEls.forEach(el => {
    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", el.dataset.coco ? "Isla del Coco" : PROV[el.dataset.id].n);
  });
  const pintar = (id, cls) => provEls.forEach(el => { if (el.dataset.id === id) el.classList.add(cls); });
  const limpiar = () => {
    provEls.forEach(el => el.classList.remove("sel", "ok", "bad", "flash"));
    document.querySelectorAll(".ciudad").forEach(g => g.classList.remove("show"));
  };
  const verCiudad = id => document.querySelector(`.ciudad[data-id="${id}"]`).classList.add("show");

  function setFeedback(kind, main, sub) {
    const fb = $("feedback");
    fb.className = "wrap feedback " + (kind || "");
    fb.innerHTML = main ? `<div>${main}${sub ? `<small>${sub}</small>` : ""}</div>` : "";
  }
  const setPrompt = html => { $("prompt").innerHTML = html; };

  const barajar = arr => arr.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

  // ---------- Modos ----------
  function iniciar() {
    limpiar();
    $("map").classList.toggle("hide-labels", modo !== "explorar");
    $("options").innerHTML = "";
    setFeedback("", "");
    mazo = [];
    if (modo === "explorar") {
      $("nextBtn").hidden = true;
      setPrompt("Tocá una provincia para conocerla 👆");
    } else {
      $("nextBtn").hidden = false;
      siguiente();
    }
  }

  function siguiente() {
    if (!mazo.length) {
      mazo = barajar(IDS);
      if (mazo[mazo.length - 1] === ultimo) mazo.unshift(mazo.pop());
    }
    meta = mazo.pop(); ultimo = meta;
    fallos = 0; listo = false;
    limpiar(); setFeedback("", "");
    $("nextBtn").classList.remove("pulse");
    if (modo === "donde") {
      $("options").innerHTML = "";
      setPrompt(`¿Dónde queda <b>${PROV[meta].n}</b>?`);
    } else {
      pintar(meta, "sel");
      setPrompt(`¿Cuál es la cabecera de <b>${PROV[meta].n}</b>?`);
      const otras = barajar(IDS.filter(id => id !== meta)).slice(0, 3);
      $("options").innerHTML = barajar([meta, ...otras])
        .map(id => `<button data-cab="${id}">${PROV[id].cab}</button>`).join("");
    }
  }

  function textoPrompt() { return $("prompt").textContent; }

  function ganar(sub) {
    listo = true;
    if (fallos === 0) {
      stars++;
      try { localStorage.setItem("provincias-stars", stars); } catch (_) {}
      $("stars").textContent = "⭐ " + stars;
      setFeedback("ok", "¡Acertado! 🎉", sub);
      hablar("¡Acertado! " + sub);
    } else {
      setFeedback("almost", "¡Casi! 🤏 A la segunda", sub);
      hablar(sub);
    }
    $("nextBtn").classList.add("pulse");
  }

  function tocar(id, esCoco) {
    const p = PROV[id];
    if (modo === "explorar") {
      limpiar(); pintar(id, "sel"); verCiudad(id);
      setPrompt(`<b>${p.n}</b>`);
      setFeedback("info", `Cabecera: ${p.cab}`, (esCoco ? "La Isla del Coco es parte de Puntarenas. " : "") + p.dato);
      hablar(`${p.n}. Su cabecera es ${p.cab}. ${p.dato}`);
      return;
    }
    if (modo !== "donde" || listo) return;
    if (id === meta) {
      limpiar(); pintar(id, "ok"); verCiudad(id);
      ganar(`Esa es ${p.n}. Su cabecera es ${p.cab}.`);
    } else {
      fallos++;
      provEls.forEach(el => {
        if (el.dataset.id === id) { el.classList.remove("flash"); void el.getBBox(); el.classList.add("flash"); }
      });
      if (VECINAS[meta].includes(id)) setFeedback("almost", "¡Casi! 🤏", `Esa es ${p.n}. ${PROV[meta].n} queda al lado.`);
      else setFeedback("bad", "Uy, no es 🙈", `Esa es ${p.n}. Buscá más ${pista(id, meta)}.`);
    }
  }

  // Dirección aproximada de una provincia respecto a otra, según sus etiquetas
  function pista(desde, hacia) {
    const a = PROV[desde], b = PROV[hacia];
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "a la derecha, hacia el Caribe" : "a la izquierda, hacia el Pacífico";
    return dy > 0 ? "abajo, hacia el sur" : "arriba, hacia el norte";
  }

  $("map").addEventListener("click", e => {
    const el = e.target.closest(".prov");
    if (el) tocar(el.dataset.id, !!el.dataset.coco);
  });
  $("map").addEventListener("keydown", e => {
    const el = e.target.closest(".prov");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tocar(el.dataset.id, !!el.dataset.coco); }
  });

  $("options").addEventListener("click", e => {
    const btn = e.target.closest("[data-cab]");
    if (!btn || listo || btn.disabled) return;
    if (btn.dataset.cab === meta) {
      btn.classList.add("right");
      $("options").querySelectorAll("button").forEach(b => { if (b !== btn) b.disabled = true; });
      limpiar(); pintar(meta, "ok"); verCiudad(meta);
      ganar(`${PROV[meta].cab} es la cabecera de ${PROV[meta].n}.`);
    } else {
      fallos++;
      btn.classList.add("wrong"); btn.disabled = true;
      setFeedback("bad", "Uy, no es 🙈", `${PROV[btn.dataset.cab].cab} es la cabecera de ${PROV[btn.dataset.cab].n}.`);
    }
  });

  $("speak").addEventListener("click", () => hablar(textoPrompt()));
  $("lento").addEventListener("click", () => hablar(textoPrompt(), true));
  $("nextBtn").addEventListener("click", siguiente);
  document.querySelectorAll(".levels button").forEach(btn => {
    btn.addEventListener("click", () => {
      modo = btn.dataset.modo;
      document.querySelectorAll(".levels button").forEach(x => x.setAttribute("aria-pressed", x === btn ? "true" : "false"));
      iniciar();
    });
  });

  $("stars").textContent = "⭐ " + stars;
  iniciar();
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
