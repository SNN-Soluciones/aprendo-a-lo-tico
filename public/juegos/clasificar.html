<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Dónde va?</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#CFEFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/prepa.css">
<style>
  :root { --materia: #2FA85A; }
  .escena {
    margin-top: 12px; background: var(--face); border: 4px solid var(--rim); border-radius: 22px;
    min-height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .cosa {
    font-size: clamp(5rem, 26vw, 7rem); line-height: 1; padding: 4px 12px;
    border: none; box-shadow: none; background: none; border-radius: 24px;
  }
  .cosa:active { transform: scale(.92); box-shadow: none; }
  .cosa.entra { animation: entra .5s ease-out; }
  .cosa.vuela { animation: vuela .45s ease-in forwards; }
  @keyframes entra { 0% { transform: scale(.2) rotate(-20deg); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes vuela { to { transform: translateY(140px) scale(.3); opacity: 0; } }

  .canastas { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 12px; margin-top: 14px; }
  .canasta {
    border-radius: 24px; padding: 8px 4px 6px; min-height: 156px; background: var(--fondo, var(--face));
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px;
  }
  .canasta .ico { font-size: clamp(1.9rem, 9vw, 2.5rem); line-height: 1.1; letter-spacing: -2px; }
  .canasta .color { width: clamp(44px, 13vw, 58px); height: clamp(44px, 13vw, 58px); border-radius: 50%; background: var(--color); border: 4px solid var(--rim); }
  .canasta .cesta { font-size: clamp(2.6rem, 13vw, 3.4rem); line-height: 1; }
  .canasta .dentro { min-height: 1.5rem; font-size: 1.25rem; line-height: 1.2; letter-spacing: -3px; max-width: 100%; overflow: hidden; white-space: nowrap; }
  .canasta .nom { font-size: .8rem; font-weight: 700; opacity: .75; line-height: 1.1; }
  .canasta.dicho { outline: 4px solid var(--btn); outline-offset: 2px; }
  .canasta.recibe .cesta { animation: pop .45s ease-out; }
</style>
</head>
<body>
<a class="home-link" href="../index.html" aria-label="Volver al inicio">🏠</a>

<div class="start" id="start">
  <div class="big" aria-hidden="true">🧺🍎🐶</div>
  <h1>¿Dónde va?</h1>
  <button id="startBtn" aria-label="Empezar">▶️</button>
  <p>Subile el volumen 🔊. Mirá el dibujo y tocá la canasta donde va.</p>
</div>

<div class="wrap top">
  <div class="levels" role="group" aria-label="Nivel">
    <button class="auto" data-nivel="auto" aria-pressed="true" aria-label="De a poquito: sube solo">🪜</button>
    <button data-nivel="tipos" aria-label="Frutas, animales, ropa y juguetes">🍎🐶</button>
    <button data-nivel="colores" aria-label="Colores">🔴🟡</button>
    <button data-nivel="naturaleza" aria-label="Agua, tierra y aire; frío y caliente">🌊☁️</button>
  </div>
  <div class="escalera" id="escalera"></div>
  <div class="stars" id="stars">⭐ 0</div>
</div>

<div class="wrap instr"><button class="oir" id="oir" aria-label="Escuchar otra vez">🔊</button><button class="lento" id="lento" aria-label="Escuchar despacio">🐢</button><div class="txt" id="instr"></div></div>
<div class="wrap escena" id="escena"></div>
<div class="wrap canastas" id="canastas"></div>
<div class="wrap feedback" id="feedback" aria-live="polite"></div>
<div class="wrap bottom"><button id="nextBtn" aria-label="Otro">➡️</button></div>

<script type="module">
import { hablar, elogio, sonido } from "../js/voz.js";
import { decir, instruccion, feedback, estrellas, niveles, alEmpezar, azar, senalar, ayudaSiSeQueda } from "../js/prepa.js";
import { escalera } from "../js/escalera.js";

const $ = id => document.getElementById(id);
const may = t => t.charAt(0).toUpperCase() + t.slice(1);

// 🧺 Canastas.
//   n: cómo se presenta · es: lo que se dice del dibujo («El mango es una fruta») · canasta y con: para nombrarla
//   ej: dibujos de muestra pintados en la canasta (no salen para ordenar) · color: canasta de un color · fondo: tinte
//   items: [emoji, nombre, artículo]
// Cada dibujo va en UNA sola canasta del escalón: se dejaron por fuera los que confunden
// (pato o rana: agua y tierra; tomate o aguacate: ¿fruta o verdura?; limón: aquí es verde; taxi: aquí es rojo).
const CATS = {
  frutas: { n: "las frutas", es: "es una fruta", canasta: "la canasta de las frutas", con: "con las frutas", ej: "🍇🍒", fondo: "#FFE6E0",
    items: [["🍎", "manzana", "la"], ["🍌", "banano", "el"], ["🍓", "fresa", "la"], ["🍉", "sandía", "la"], ["🍍", "piña", "la"],
      ["🥭", "mango", "el"], ["🍊", "naranja", "la"], ["🍐", "pera", "la"], ["🥥", "coco", "el"]] },
  animales: { n: "los animales", es: "es un animal", canasta: "la canasta de los animales", con: "con los animales", ej: "🦒🦓", fondo: "#FFF1D6",
    items: [["🐶", "perro", "el"], ["🐱", "gato", "el"], ["🐮", "vaca", "la"], ["🐷", "chancho", "el"], ["🐴", "caballo", "el"], ["🐰", "conejo", "el"],
      ["🐒", "mono", "el"], ["🐘", "elefante", "el"], ["🦁", "león", "el"], ["🐸", "rana", "la"], ["🐢", "tortuga", "la"], ["🐔", "gallina", "la"]] },
  ropa: { n: "la ropa", es: "es ropa", canasta: "la canasta de la ropa", con: "con la ropa", ej: "🧦🧤", fondo: "#E7E9FF",
    items: [["👕", "camisa", "la"], ["👖", "pantalón", "el"], ["👗", "vestido", "el"], ["🧥", "chaqueta", "la"], ["👞", "zapato", "el"],
      ["🧢", "gorra", "la"], ["👒", "sombrero", "el"], ["👚", "blusa", "la"], ["🥾", "bota", "la"]] },
  juguetes: { n: "los juguetes", es: "es un juguete", canasta: "la canasta de los juguetes", con: "con los juguetes", ej: "🪁🏀", fondo: "#F6E3FF",
    items: [["⚽", "bola", "la"], ["🧸", "osito de peluche", "el"], ["🪀", "yoyo", "el"], ["🎈", "globo", "el"], ["🧩", "rompecabezas", "el"],
      ["🎲", "dado", "el"], ["🛹", "patineta", "la"], ["🤖", "robot", "el"]] },
  verduras: { n: "las verduras", es: "es una verdura", canasta: "la canasta de las verduras", con: "con las verduras", ej: "🥕🥬", fondo: "#E2F6DA",
    items: [["🥦", "brócoli", "el"], ["🥔", "papa", "la"], ["🧅", "cebolla", "la"], ["🌽", "elote", "el"], ["🥒", "pepino", "el"], ["🧄", "ajo", "el"]] },

  rojo: { n: "rojo", es: "es de color rojo", canasta: "la canasta roja", con: "con lo rojo", color: "#E53935",
    items: [["🍎", "manzana", "la"], ["🍓", "fresa", "la"], ["🚒", "camión de bomberos", "el"], ["❤️", "corazón", "el"], ["🍅", "tomate", "el"],
      ["🦀", "cangrejo", "el"], ["🌶️", "chile", "el"]] },
  amarillo: { n: "amarillo", es: "es de color amarillo", canasta: "la canasta amarilla", con: "con lo amarillo", color: "#FFD600",
    items: [["🍌", "banano", "el"], ["🐥", "pollito", "el"], ["⭐", "estrella", "la"], ["🌽", "elote", "el"], ["🧀", "queso", "el"], ["🌻", "girasol", "el"]] },
  verde: { n: "verde", es: "es de color verde", canasta: "la canasta verde", con: "con lo verde", color: "#2FA85A",
    items: [["🐸", "rana", "la"], ["🥦", "brócoli", "el"], ["🍀", "trébol", "el"], ["🥒", "pepino", "el"], ["🌵", "cactus", "el"],
      ["🦖", "dinosaurio", "el"], ["🐊", "cocodrilo", "el"], ["🥬", "lechuga", "la"]] },
  azul: { n: "azul", es: "es de color azul", canasta: "la canasta azul", con: "con lo azul", color: "#1E6FD9",
    items: [["💧", "gota de agua", "la"], ["🌊", "ola", "la"], ["👖", "pantalón", "el"], ["🧢", "gorra", "la"], ["🐳", "ballena", "la"]] },

  agua: { n: "los que viven en el agua", es: "vive en el agua", canasta: "la canasta del agua", con: "con los del agua", ej: "🌊", fondo: "#D7EEFF",
    items: [["🐟", "pez", "el"], ["🐙", "pulpo", "el"], ["🐬", "delfín", "el"], ["🐳", "ballena", "la"], ["🦈", "tiburón", "el"],
      ["🦑", "calamar", "el"], ["🐡", "pez globo", "el"]] },
  tierra: { n: "los que viven en la tierra", es: "vive en la tierra", canasta: "la canasta de la tierra", con: "con los de la tierra", ej: "⛰️🌳", fondo: "#E8F5D0",
    items: [["🐶", "perro", "el"], ["🐮", "vaca", "la"], ["🐴", "caballo", "el"], ["🐘", "elefante", "el"], ["🦁", "león", "el"],
      ["🐰", "conejo", "el"], ["🐷", "chancho", "el"], ["🦒", "jirafa", "la"], ["🐻", "oso", "el"]] },
  aire: { n: "los que vuelan", es: "vuela por el aire", canasta: "la canasta del aire", con: "con los que vuelan", ej: "☁️", fondo: "#EEF6FF",
    items: [["🐦", "pajarito", "el"], ["🦋", "mariposa", "la"], ["🐝", "abeja", "la"], ["🦉", "búho", "el"], ["🦅", "águila", "el"],
      ["🦜", "lapa", "la"], ["🦇", "murciélago", "el"]] },
  frio: { n: "lo frío", es: "está frío", canasta: "la canasta de lo frío", con: "con lo frío", ej: "❄️", fondo: "#E3F4FF",
    items: [["🍦", "helado", "el"], ["🧊", "cubo de hielo", "el"], ["⛄", "muñeco de nieve", "el"], ["🍧", "granizado", "el"]] },
  caliente: { n: "lo caliente", es: "está caliente", canasta: "la canasta de lo caliente", con: "con lo caliente", ej: "🔥", fondo: "#FFE4D6",
    items: [["☕", "café", "el"], ["🍲", "sopa", "la"], ["🌋", "volcán", "el"], ["🍳", "huevo frito", "el"], ["☀️", "sol", "el"], ["🍵", "té", "el"]] },
};

// 🪜 De a poquito: qué canastas hay en cada escalón (cada dibujo es una ronda)
const ESCALONES = [
  ["frutas", "animales"],                 // 1. dos cosas muy distintas
  ["ropa", "juguetes"],                   // 2. otra pareja fácil
  ["rojo", "amarillo"],                   // 3. por color, dos canastas
  ["frutas", "animales", "ropa"],         // 4. tres canastas
  ["agua", "tierra"],                     // 5. dónde viven
  ["frio", "caliente"],                   // 6. frío o caliente
  ["rojo", "amarillo", "verde"],          // 7. tres colores
  ["agua", "tierra", "aire"],             // 8. ¿y los que vuelan?
  ["frutas", "verduras"],                 // 9. se parecen: hay que pensar más
  ["rojo", "amarillo", "verde", "azul"],  // 10. cuatro colores
];
// Niveles a mano (para el papá): van rotando por los escalones del grupo cada 5 dibujos
const GRUPOS = { tipos: [0, 1, 3, 8], colores: [2, 6, 9], naturaleza: [4, 5, 7] };
const POR_TANDA = 5;

const esc = escalera("clasificar", {
  escalones: ESCALONES.length,
  inicio: edad => edad === null || edad <= 4 ? 0 : edad === 5 ? 1 : edad === 6 ? 3 : 4,
});
const stars = estrellas("clasificar-stars");

let actual = -1, cats = [], item = null, meta = 0, fallos = 0, listo = true, ronda = 0, ultimo = "", seguidas = [];
let manual = null; // { lista, i, cuenta } cuando el papá escogió un grupo
const ayuda = ayudaSiSeQueda({ senalar: () => senalar(botones()[meta]) });

const botones = () => Array.from($("canastas").querySelectorAll(".canasta"));
const nombre = it => `${it[2]} ${it[1]}`;
const espera = ms => new Promise(r => setTimeout(r, ms));
// Espera a que la voz termine (por ejemplo, el «¡Subiste un escalón!» que va en cola), con un tope
const callado = () => new Promise(r => {
  const t0 = Date.now();
  const f = () => { let s = false; try { s = speechSynthesis.speaking; } catch (_) {}; if (!s || Date.now() - t0 > 6000) r(); else setTimeout(f, 250); };
  f();
});
// «¿Con las frutas o con los animales?» / «¿Con lo rojo, con lo amarillo o con lo verde?»
const opcionesDichas = () => {
  const c = cats.map(id => CATS[id].con);
  return may(c.length > 1 ? `${c.slice(0, -1).join(", ")} o ${c[c.length - 1]}` : c[0]);
};

function pintarCanastas() {
  $("canastas").style.setProperty("--n", cats.length === 4 ? 2 : cats.length);
  $("canastas").innerHTML = cats.map((id, i) => {
    const c = CATS[id];
    const arriba = c.color ? `<span class="color" style="--color:${c.color}"></span>` : `<span class="ico">${c.ej}</span>`;
    return `<button class="canasta" data-i="${i}" style="--fondo:${c.fondo || "var(--face)"}" aria-label="${may(c.canasta)}">
      ${arriba}<span class="cesta" aria-hidden="true">🧺</span><span class="dentro" aria-hidden="true"></span><span class="nom">${may(c.n)}</span></button>`;
  }).join("");
}

async function presentarCanastas(t) {
  await hablar("Mirá las canastas.");
  for (const b of botones()) {
    if (t !== ronda || listo) return;
    b.classList.add("dicho");
    await hablar(may(CATS[cats[Number(b.dataset.i)]].n));
    b.classList.remove("dicho");
  }
}

function escalonQueToca() {
  if (!manual) return esc.nivel;
  if (manual.cuenta >= POR_TANDA) { manual.cuenta = 0; manual.i = (manual.i + 1) % manual.lista.length; }
  manual.cuenta++;
  return manual.lista[manual.i];
}

async function siguiente() {
  const t = ++ronda;
  fallos = 0; listo = false;
  const n = escalonQueToca();
  const nuevas = n !== actual;
  if (nuevas) { actual = n; cats = ESCALONES[n]; pintarCanastas(); seguidas = []; }
  botones().forEach(b => { b.disabled = false; b.classList.remove("right", "wrong", "nope", "senal", "recibe"); });

  // Un dibujo de alguna canasta: no el mismo de antes ni tres veces seguidas la misma canasta
  let i;
  do i = Math.floor(Math.random() * cats.length);
  while (seguidas.length >= 2 && seguidas.slice(-2).every(x => x === i));
  seguidas.push(i);
  meta = i;
  const lista = CATS[cats[i]].items.filter(it => it[0] !== ultimo);
  item = azar(lista);
  ultimo = item[0];

  $("escena").innerHTML = `<button class="cosa entra" id="cosa" aria-label="${item[1]}">${item[0]}</button>`;
  feedback("");
  $("nextBtn").classList.remove("pulse");
  $("instr").innerHTML = "";
  if (nuevas) await presentarCanastas(t);
  if (t !== ronda || listo) return; // ya contestó mientras se presentaban las canastas
  instruccion(`<span class="big">${item[0]}</span> ¿Dónde va?`, `¿Dónde va ${nombre(item)}? ¿${opcionesDichas()}?`);
  ayuda.empezar();
}

// Tocar el dibujo dice su nombre
$("escena").addEventListener("click", e => {
  if (!e.target.closest("#cosa") || !item) return;
  sonido("tap"); hablar(may(nombre(item)));
});

$("canastas").addEventListener("click", async e => {
  const b = e.target.closest(".canasta");
  if (!b || listo || b.disabled) return;
  const i = Number(b.dataset.i), bien = CATS[cats[meta]];
  if (i === meta) {
    listo = true;
    ayuda.parar();
    const t = ronda;
    b.classList.remove("senal");
    b.classList.add("right", "recibe");
    botones().forEach(x => { if (x !== b) x.disabled = true; });
    // El dibujo cae en la canasta (se ven los últimos 5)
    $("cosa")?.classList.replace("entra", "vuela");
    const dentro = b.querySelector(".dentro");
    dentro.textContent = (Array.from(dentro.textContent.match(/\p{Extended_Pictographic}️?/gu) || []).slice(-4).join("")) + item[0];
    const frase = `${may(nombre(item))} ${bien.es}.`;
    const limpio = fallos === 0 && !ayuda.usada;
    let dicho;
    if (limpio) { const bravo = elogio(); stars.sumar(); feedback("ok", "🎉", bravo); dicho = decir(`${bravo} ${frase}`); }
    else { feedback("almost", "🤏", "¡Ahora sí!"); dicho = decir(`¡Ahora sí! ${frase}`); }
    esc.resultado({ fallos, ayuda: ayuda.usada, opciones: cats.length });
    $("nextBtn").classList.add("pulse");
    // Sigue solo cuando la voz termina (o con ➡️)
    await dicho; await callado(); await espera(400);
    if (t === ronda) siguiente();
  } else {
    fallos++;
    b.classList.add("wrong", "nope"); b.disabled = true;
    feedback("bad", "🙈", "No es");
    if (fallos >= 2) {
      senalar(botones()[meta]);
      decir(`${may(nombre(item))} ${bien.es}. ¡Es aquí! Tocá ${bien.canasta}.`);
    } else {
      decir(`Esa es ${CATS[cats[i]].canasta}. ${may(nombre(item))} ${bien.es}. Buscá ${bien.canasta}.`);
    }
  }
});

$("nextBtn").addEventListener("click", () => { sonido("tap"); siguiente(); });
niveles(v => {
  esc.activa = v === "auto";
  manual = v === "auto" ? null : { lista: GRUPOS[v], i: 0, cuenta: 0 };
  actual = -1;
  siguiente();
});
alEmpezar(siguiente);

if (new URLSearchParams(location.search).has("prueba")) {
  window.__clasificar = {
    get correcta() { return meta; }, get item() { return item; }, get canastas() { return cats; },
    get escalon() { return actual; }, get listo() { return listo; }, ESCALONES, CATS,
  };
}
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
